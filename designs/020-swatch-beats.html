<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Internet Time</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(160deg,#ff3d7f,#ff9a3d 50%,#ffd23d);color:#fff;font-family:"Arial Black",Arial,sans-serif}
.wrap{height:100%;display:flex;align-items:center;justify-content:center}
.ring{position:relative;width:min(84vw,84vh);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.at{font-size:min(16vw,16vh);line-height:1;letter-spacing:-.04em;text-shadow:0 .5vmin 2vmin rgba(0,0,0,.15)}
.at small{font-size:.35em;opacity:.85}
.bmt{font-family:Arial,sans-serif;font-weight:bold;letter-spacing:.4em;font-size:min(2.4vw,2.4vh);opacity:.85;margin-top:1vh}
.loc{font-family:Arial,sans-serif;font-size:min(2.6vw,2.6vh);margin-top:3vh;opacity:.95;text-align:center;line-height:1.5}
</style></head><body>
<div class="wrap"><div class="ring">
<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="3"/><circle id="p" cx="50" cy="50" r="46" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="289"/></svg>
<div class="at" id="b"></div><div class="bmt">INTERNET TIME · BMT</div><div class="loc" id="l"></div>
</div></div>
<script>
const C=2*Math.PI*46;
function tick(){const n=new Date(),sec=(n.getUTCHours()*3600+n.getUTCMinutes()*60+n.getUTCSeconds()+n.getUTCMilliseconds()/1000+3600)%86400,beats=sec/86.4;
const [i,f]=beats.toFixed(2).split('.');document.getElementById('b').innerHTML='@'+i.padStart(3,'0')+'<small>.'+f+'</small>';
document.getElementById('p').style.strokeDashoffset=C*(1-beats/1000);
document.getElementById('l').innerHTML=n.toLocaleTimeString()+'<br>'+n.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});requestAnimationFrame(tick)}
document.getElementById('p').setAttribute('stroke-dasharray',C);tick();
</script></body></html>
