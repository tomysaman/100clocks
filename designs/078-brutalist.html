<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brutalist</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:#000;font-family:"Times New Roman",Times,serif}
.b{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto;border:4px solid #000;box-sizing:border-box}
.b>*{border:2px solid #000;padding:1.5vmin;box-sizing:border-box;min-width:0;min-height:0;overflow:hidden}
.h{grid-column:1/3;font-size:clamp(12px,2.2vmin,22px);display:flex;justify-content:space-between;text-transform:uppercase}
.t{grid-column:1/3;display:flex;align-items:center;justify-content:center;font-size:min(27vw,52vh);font-weight:bold;letter-spacing:-.05em;line-height:.8}
.t mark{background:#ff0;padding:0 .05em}
.f{font-size:clamp(12px,2.4vmin,24px)}
.f a{color:#00e;text-decoration:underline;cursor:pointer}
.f u{background:#000;color:#fff;text-decoration:none;padding:0 .3em}
</style></head><body>
<div class="b">
<div class="h"><span>INDEX OF /TIME</span><span id="s"></span></div>
<div class="t"><span id="hh"></span>:<mark id="mm"></mark></div>
<div class="f">DATE: <u id="d"></u><br>DAY: <span id="wd"></span></div>
<div class="f">[<a id="sw">SWITCH 12/24</a>] [<a id="inv">INVERT</a>]<br>LAST MODIFIED: <span id="lm"></span></div>
</div>
<script>
let h12=false;try{h12=localStorage.getItem('brut12')==='1'}catch(e){}
document.getElementById('sw').onclick=()=>{h12=!h12;try{localStorage.setItem('brut12',h12?'1':'0')}catch(e){}tick()};
document.getElementById('inv').onclick=()=>{document.documentElement.style.filter=document.documentElement.style.filter?'':'invert(1)'};
function tick(){const d=new Date(),p=n=>String(n).padStart(2,'0');let h=d.getHours();if(h12)h=h%12||12;
document.getElementById('hh').textContent=p(h);document.getElementById('mm').textContent=p(d.getMinutes());
document.getElementById('s').textContent='SECONDS: '+p(d.getSeconds())+(h12?(d.getHours()<12?' AM':' PM'):'');
document.getElementById('d').textContent=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
document.getElementById('wd').textContent=d.toLocaleDateString('en',{weekday:'long'}).toUpperCase();
document.getElementById('lm').textContent=d.toUTCString().toUpperCase()}
tick();setInterval(tick,500);
</script></body></html>
