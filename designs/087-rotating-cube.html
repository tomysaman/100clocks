<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rotating Cube</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(#2c2f4a,#0f1020);font-family:"Segoe UI",system-ui,sans-serif;color:#fff}
.scene{position:fixed;left:50%;top:50%;width:min(44vw,44vh);height:min(44vw,44vh);margin:calc(min(44vw,44vh)/-2) 0 0 calc(min(44vw,44vh)/-2);perspective:160vmin}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 1.2s cubic-bezier(.5,-.3,.4,1.3)}
.f{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:1vmin;backface-visibility:hidden;box-shadow:inset 0 0 0 .3vmin rgba(255,255,255,.25)}
.f b{font-size:min(17vw,17vh);font-weight:200;line-height:1}
.f span{font-size:min(2.4vw,2.4vh);letter-spacing:.3em;opacity:.8}
.f small{font-size:min(4vw,4vh)}
.f1{background:linear-gradient(135deg,#ff5f6d,#ffc371);transform:translateZ(calc(min(44vw,44vh)/2))}
.f2{background:linear-gradient(135deg,#36d1dc,#5b86e5);transform:rotateY(90deg) translateZ(calc(min(44vw,44vh)/2))}
.f3{background:linear-gradient(135deg,#a18cd1,#fbc2eb);transform:rotateY(180deg) translateZ(calc(min(44vw,44vh)/2))}
.f4{background:linear-gradient(135deg,#43e97b,#38f9d7);color:#063;transform:rotateY(-90deg) translateZ(calc(min(44vw,44vh)/2))}
.f5{background:linear-gradient(135deg,#f6d365,#fda085);color:#5a2a00;transform:rotateX(90deg) translateZ(calc(min(44vw,44vh)/2))}
.f6{background:linear-gradient(135deg,#30cfd0,#330867);transform:rotateX(-90deg) translateZ(calc(min(44vw,44vh)/2))}
.cap{position:fixed;bottom:5vh;left:0;right:0;text-align:center;font-size:clamp(12px,2.6vmin,26px);opacity:.8}
</style></head><body>
<div class="scene"><div class="cube" id="cb">
<div class="f f1"><span>HOURS</span><b id="h"></b></div><div class="f f2"><span>MINUTES</span><b id="m"></b></div>
<div class="f f3"><span>SECONDS</span><b id="s"></b></div><div class="f f4"><span id="wd"></span><b id="dd"></b><small id="mo"></small></div>
<div class="f f5"><span>YEAR</span><b id="y" style="font-size:min(10vw,10vh)"></b></div><div class="f f6"><span>TIME</span><b id="tt" style="font-size:min(8vw,8vh)"></b></div>
</div></div>
<div class="cap" id="cap"></div>
<script>
// The cube turns to a new face every 3 seconds, cycling: hours → minutes → seconds → date → year → full time
const VIEWS=[[0,0],[0,-90],[0,-180],[0,-270],[-90,-360],[90,-360]];let vi=0,turn=0;
function tick(){const d=new Date(),p=n=>String(n).padStart(2,'0');
document.getElementById('h').textContent=p(d.getHours());document.getElementById('m').textContent=p(d.getMinutes());document.getElementById('s').textContent=p(d.getSeconds());
document.getElementById('wd').textContent=d.toLocaleDateString(undefined,{weekday:'long'}).toUpperCase();document.getElementById('dd').textContent=d.getDate();document.getElementById('mo').textContent=d.toLocaleDateString(undefined,{month:'long'});
document.getElementById('y').textContent=d.getFullYear();document.getElementById('tt').textContent=p(d.getHours())+':'+p(d.getMinutes());
document.getElementById('cap').textContent=d.toLocaleString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function rotate(){vi=(vi+1)%VIEWS.length;if(vi===0)turn++;const [rx,ry]=VIEWS[vi];document.getElementById('cb').style.transform=`rotateX(${rx-12}deg) rotateY(${ry-turn*360+12}deg)`}
document.getElementById('cb').style.transform='rotateX(-12deg) rotateY(12deg)';
tick();setInterval(tick,250);setInterval(rotate,3000);
</script></body></html>
