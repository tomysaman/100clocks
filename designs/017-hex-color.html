<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hex Color Time</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:"Courier New",monospace;transition:background 1s linear,color 1s}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center}
.t{font-size:clamp(36px,min(14vw,22vh),240px);font-weight:bold;letter-spacing:-.02em}
.sub{font-size:clamp(12px,2.6vmin,26px);opacity:.7}
.mode{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.mode button{font:inherit;font-size:13px;padding:6px 12px;border-radius:20px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer;opacity:.6}
.mode button.act{opacity:1;background:rgba(127,127,127,.25)}
</style></head><body>
<div class="wrap"><div class="t" id="t"></div><div class="sub" id="s"></div><div class="sub" id="d"></div></div>
<div class="mode"><button data-m="lit">#HHMMSS</button><button data-m="scaled">scaled to 255</button></div>
<script>
let mode='lit';try{mode=localStorage.getItem('hexmode')||'lit'}catch(e){}
document.querySelectorAll('.mode button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;try{localStorage.setItem('hexmode',mode)}catch(e){}tick()});
function tick(){const d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds(),p=n=>String(n).padStart(2,'0');let rgb;
if(mode==='lit'){rgb=[parseInt(p(h),16),parseInt(p(m),16),parseInt(p(s),16)]}else{rgb=[Math.round(h/23*255),Math.round(m/59*255),Math.round(s/59*255)]}
const hex='#'+rgb.map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase();
document.body.style.background=hex;const lum=(.299*rgb[0]+.587*rgb[1]+.114*rgb[2]);document.body.style.color=lum>140?'#111':'#f5f5f5';
document.getElementById('t').textContent=mode==='lit'?'#'+p(h)+p(m)+p(s):hex;
document.getElementById('s').textContent=`${p(h)}:${p(m)}:${p(s)}  ·  rgb(${rgb.join(', ')})`;
document.getElementById('d').textContent=d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
document.querySelectorAll('.mode button').forEach(b=>b.classList.toggle('act',b.dataset.m===mode))}
tick();setInterval(tick,1000);
</script></body></html>
