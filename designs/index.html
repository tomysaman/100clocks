<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock designs</title>
<style>
	:root { --bg: #f6f4ef; --ink: #1d1b18; --muted: #6b665d; --line: #dcd7cc; --accent: #b3263a; --like: #2e7d4f; }
	* { box-sizing: border-box; }
	body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
	header { padding: 48px 16px 16px; max-width: 1200px; margin: 0 auto; }
	h1 { margin: 0 0 8px; font-size: 2rem; }
	p { margin: 0; color: var(--muted); }
	.tools { max-width: 1200px; margin: 0 auto; padding: 8px 16px 20px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
	.tools button { font: inherit; font-size: .9rem; padding: 6px 12px; border: 1px solid var(--line); background: #fff; border-radius: 999px; cursor: pointer; color: inherit; }
	.tools button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
	.tools .count { color: var(--muted); font-size: .9rem; margin-left: auto; }
	.tools a { color: var(--accent); font-size: .9rem; }
	ol { list-style: none; padding: 0 16px 64px; margin: 0 auto; max-width: 1200px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
	li { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; transition: opacity .2s, filter .2s; }
	li:hover { border-color: var(--accent); }
	li.liked { border-color: var(--like); box-shadow: 0 0 0 2px var(--like); }
	li.disliked { background: #ecebe7; border-style: dashed; }
	li.disliked .thumb, li.disliked .meta { opacity: .45; filter: grayscale(1); transition: opacity .2s; }
	li.disliked:hover .thumb, li.disliked:hover .meta { opacity: .8; }
	li.hidden { display: none; }
	.thumb { display: block; position: relative; aspect-ratio: 16 / 10; background: #222; overflow: hidden; }
	.thumb iframe { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; border: 0; transform-origin: 0 0; pointer-events: none; }
	.meta { display: block; padding: 10px 12px 12px; color: inherit; text-decoration: none; }
	.meta b { display: block; }
	.meta span { font-size: .85rem; color: var(--muted); }
	.n { color: var(--accent); font-variant-numeric: tabular-nums; margin-right: 6px; }
	.vote { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 2; }
	.vote button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); box-shadow: 0 1px 4px rgba(0,0,0,.3); cursor: pointer; font-size: 16px; line-height: 1; opacity: .85; }
	.vote button:hover { opacity: 1; transform: scale(1.08); }
	li.liked .vote .up { background: var(--like); color: #fff; opacity: 1; }
	li.disliked .vote .down { background: var(--accent); color: #fff; opacity: 1; }
	dialog { border: 1px solid var(--line); border-radius: 10px; max-width: 560px; width: 92vw; }
	dialog textarea { width: 100%; height: 220px; font: 13px/1.5 Consolas, monospace; }
</style>
</head>
<body>
<header>
	<h1>Clock designs</h1>
	<p>100 single-file clocks. Each one shows the time and date and fits on one screen. Previews are live. Click a card to open it, 👍 / 👎 to mark it. Marks are saved in this browser.</p>
</header>
<div class="tools" id="tools">
	<button data-f="all" class="on">All</button>
	<button data-f="liked">👍 Liked</button>
	<button data-f="disliked">👎 Disliked</button>
	<button data-f="none">Unmarked</button>
	<button id="export">Copy marks</button>
	<button id="clear">Clear marks</button>
	<a href="viewer.html">Slideshow viewer →</a>
	<span class="count" id="count"></span>
</div>
<ol id="list"></ol>
<dialog id="dlg"><p style="margin-bottom:8px">Your marks (copied to the clipboard if allowed):</p><textarea id="out" readonly></textarea><form method="dialog" style="text-align:right;margin-top:8px"><button>Close</button></form></dialog>
<script>
const D = [
	['001-analog-classic.html','Classic analog','Gold case, cream face, Roman numerals, date window'],
	['002-bauhaus-minimal.html','Minimal Bauhaus','Plain face, yellow seconds hand, dark mode toggle'],
	['003-swiss-railway.html','Swiss railway','Red-disc seconds hand that pauses at twelve'],
	['004-skeleton-gears.html','Skeleton gears','Turning brass gears and a balance wheel'],
	['005-24-hour-dial.html','24-hour dial','Noon at the top, day and night halves'],
	['006-seven-segment.html','Seven segment','Red LED digits; colour, 12/24h and seconds settings'],
	['007-dot-matrix.html','Dot matrix','Amber LED board, date line alternates with seconds'],
	['008-nixie-tubes.html','Nixie tubes','Glowing orange digits in glass tubes'],
	['009-vfd-display.html','VFD display','Cyan vacuum-fluorescent panel with weekday lamps'],
	['010-lcd-wristwatch.html','LCD wristwatch','Digital watch with backlight and 12/24h buttons'],
	['011-split-flap-board.html','Split-flap board','Station board flaps for time and date'],
	['012-word-grid.html','Word grid','Letter grid lights up the words, dots for extra minutes'],
	['013-sentence-clock.html','Sentence clock','The time as a sentence in a big serif'],
	['014-roman-numerals.html','Roman numerals','Time and date in Roman numerals, Latin weekday'],
	['015-binary-leds.html','Binary LEDs','Rows of blue LEDs for hours, minutes and seconds'],
	['016-bcd-blocks.html','BCD blocks','Binary-coded decimal columns in pastel blocks'],
	['017-hex-color.html','Hex colour time','Background colour is #HHMMSS'],
	['018-unix-epoch.html','Unix epoch','Seconds since 1970 with milestone countdown'],
	['019-french-decimal.html','French decimal','10-hour day dial and Republican calendar'],
	['020-swatch-beats.html','Internet time','Swatch .beats on a gradient ring'],
	['021-mars-sol.html','Mars sol','Coordinated Mars Time and sol number'],
	['022-neon-rings.html','Neon rings','Concentric glowing progress rings'],
	['023-progress-bars.html','Progress bars','Year, month, week, day, hour, minute as bars'],
	['024-pie-trio.html','Pie trio','Three filling pie charts'],
	['025-dot-orbits.html','Dot orbits','Rings of dots fill for hours, minutes, seconds'],
	['026-particle-digits.html','Particle digits','Particles fly into the digits, mouse scatters them'],
	['027-grandfather-pendulum.html','Grandfather clock','Wooden case with a swinging pendulum'],
	['028-hourglass.html','Hourglass','Sand runs out once a minute'],
	['029-water-tank.html','Water tank','Water level rises through the hour'],
	['030-terminal.html','Terminal','Shell typing date commands, block-letter time'],
	['031-dos-commander.html','DOS commander','Blue two-panel file manager with a calendar'],
	['032-handheld-console.html','Handheld console','Green-screen game boy with a walking sprite'],
	['033-digital-rain.html','Digital rain','Falling green glyphs reveal the time'],
	['034-falling-blocks.html','Falling blocks','Tetris-style blocks drop into digits'],
	['035-chinese-shichen.html','Shichen dial','Chinese two-hour periods and lunar date'],
	['036-sundial.html','Sundial','Stone dial with a moving shadow'],
	['037-orrery.html','Orrery','Planets orbit for hours, minutes, days'],
	['038-sky-arc.html','Sky arc','Sun and moon cross a sky that changes colour'],
	['039-tear-off-calendar.html','Tear-off calendar','Daily page you can tear off'],
	['040-typewriter.html','Typewriter','Time typed out each minute on paper'],
	['041-neon-sign.html','Neon sign','Flickering neon on brick, colour presets'],
	['042-chalkboard.html','Chalkboard','Chalk-drawn clock face and date'],
	['043-blueprint.html','Blueprint','Technical drawing with hand angles'],
	['044-morse-lamp.html','Morse lamp','Lamp blinks the time in Morse'],
	['045-braille.html','Braille','Embossed Braille cells'],
	['046-tally-marks.html','Tally marks','Hand-scratched tallies'],
	['047-soroban-abacus.html','Soroban abacus','Beads set to the time'],
	['048-barcode.html','Barcode','Valid EAN-13 of the date and time'],
	['049-pip-dice.html','Pip dice','Nine-pip dice faces for digits'],
	['050-fibonacci.html','Fibonacci clock','Coloured 1-1-2-3-5 squares'],
	['051-berlin-clock.html','Berlin clock','Set-theory lamp rows'],
	['052-swiss-poster.html','Swiss poster','Huge black and red numerals on a grid'],
	['053-number-strips.html','Number strips','Columns of digits slide into place'],
	['054-odometer.html','Odometer','Rolling drums like a car counter'],
	['055-radar-sweep.html','Radar sweep','Green radar, blips for hour and minute'],
	['056-oscilloscope.html','Oscilloscope','Beam traces the digits on a CRT'],
	['057-year-spiral.html','Year spiral','365 dots spiral, today highlighted'],
	['058-candle-clock.html','Candle clock','Candle burns down through the day'],
	['059-timeline-ruler.html','Timeline ruler','Scrolling ruler with 1h/6h/24h zoom'],
	['060-dashboard-tiles.html','Dashboard tiles','Coloured tiles: date, week, moon, progress'],
	['061-vu-meters.html','VU meters','Analog needles for hours and minutes'],
	['062-thermometers.html','Thermometers','Mercury columns for H, M, S'],
	['063-mondrian.html','Mondrian','Primary-colour blocks recomposed each minute'],
	['064-star-clock.html','Star clock','Big Dipper turns around Polaris'],
	['065-rotating-dial.html','Rotating dial','Giant dial turns under a fixed pointer'],
	['066-car-dashboard.html','Car dashboard','Tacho for hours, speedo for minutes'],
	['067-radio-tuner.html','Radio tuner','Amber dial with minute and hour needles'],
	['068-moon-phase.html','Moon phase','Current lunar phase and next full moon'],
	['069-countdowns.html','Countdowns','To midnight, weekend, Christmas, New Year'],
	['070-periodic-table.html','Periodic time','Elements whose atomic numbers are the time'],
	['071-emoji.html','Emoji clock','Clock emoji and a row of hour squares'],
	['072-world-clocks.html','World clocks','Grid of city clocks, choose cities'],
	['073-world-time-ring.html','World time ring','24-city ring around an analog face'],
	['074-world-calendars.html','World calendars','Today in twelve calendar systems'],
	['075-numeral-systems.html','Numeral systems','Time in 20 scripts, cycles or pick one'],
	['076-maya-numerals.html','Maya numerals','Bar-and-dot digits and Long Count'],
	['077-glitch.html','Glitch','RGB split and corrupted digits'],
	['078-brutalist.html','Brutalist','Raw borders, yellow highlight, 12/24 toggle'],
	['079-newspaper.html','The Daily Clock','Front page with time headline'],
	['080-receipt.html','Receipt','Thermal receipt printed each minute'],
	['081-lava-lamp.html','Lava lamp','Rising blobs, time on the base'],
	['082-vinyl-record.html','Vinyl record','Spinning record, tonearm moves through the hour'],
	['083-piano-chime.html','Piano chime','Hour key lit, plays the time'],
	['084-dominoes.html','Dominoes','Double-nine dominoes for H, M, S'],
	['085-playing-cards.html','Playing cards','Hour card plus minute cards'],
	['086-isometric-blocks.html','Isometric blocks','3D cubes stack into digits'],
	['087-rotating-cube.html','Rotating cube','Cube turns to hours, minutes, date faces'],
	['088-sticky-notes.html','Sticky notes','Notes on cork with a to-do list'],
	['089-stock-ticker.html','Stock ticker','Quote screen with candles and tape'],
	['090-heart-monitor.html','Heart monitor','ECG trace beating each second'],
	['091-code-editor.html','Code editor','Live JSON in an editor window'],
	['092-e-ink.html','E-ink display','Paper screen refreshing once a minute'],
	['093-kanji-vertical.html','Kanji vertical','Japanese vertical writing'],
	['094-phyllotaxis.html','Phyllotaxis','One sunflower seed per minute of the day'],
	['095-liquid-text.html','Liquid text','Digits fill with liquid over the minute'],
	['096-kinetic-type.html','Kinetic type','Words animate in each minute'],
	['097-chronograph-complications.html','Grand complication','Sub-dials for day, month, seconds, moon'],
	['098-newtons-cradle.html','Newton\'s cradle','Balls click once a second'],
	['099-pocket-watch.html','Pocket watch','Gold hunter case, click to open the lid'],
	['100-flow-field.html','Flow field','Generative lines, new pattern every minute']
];
const KEY = 'clock-designs-marks';
let marks = {}; try { marks = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch (e) {} };
let filter = 'all';
const list = document.getElementById('list');

D.forEach(([file, title, desc], i) => {
	const li = document.createElement('li'); li.dataset.file = file;
	li.innerHTML = `<a class="thumb" href="${file}"><iframe loading="lazy" tabindex="-1" title="${title}"></iframe></a>
		<div class="vote"><button class="up" title="Like">👍</button><button class="down" title="Dislike">👎</button></div>
		<a class="meta" href="${file}"><b><span class="n">${String(i + 1).padStart(2, '0')}</span>${title}</b><span>${desc}</span></a>`;
	li.querySelector('.up').onclick = () => toggle(file, 'liked');
	li.querySelector('.down').onclick = () => toggle(file, 'disliked');
	list.appendChild(li);
});

function toggle(file, v) { if (marks[file] === v) delete marks[file]; else marks[file] = v; save(); render(); }
function render() {
	let n = { liked: 0, disliked: 0 };
	[...list.children].forEach(li => {
		const m = marks[li.dataset.file];
		li.classList.toggle('liked', m === 'liked'); li.classList.toggle('disliked', m === 'disliked');
		if (m) n[m]++;
		li.classList.toggle('hidden', filter === 'liked' ? m !== 'liked' : filter === 'disliked' ? m !== 'disliked' : filter === 'none' ? !!m : false);
	});
	document.getElementById('count').textContent = `${n.liked} liked · ${n.disliked} disliked · ${D.length - n.liked - n.disliked} unmarked`;
	scale();
}
document.querySelectorAll('#tools [data-f]').forEach(b => b.onclick = () => {
	filter = b.dataset.f; document.querySelectorAll('#tools [data-f]').forEach(x => x.classList.toggle('on', x === b)); render();
});
document.getElementById('clear').onclick = () => { if (confirm('Clear all likes and dislikes?')) { marks = {}; save(); render(); } };
document.getElementById('export').onclick = () => {
	const pick = v => D.filter(d => marks[d[0]] === v).map(d => d[0]);
	const txt = `Liked (${pick('liked').length}):\n${pick('liked').join('\n')}\n\nDisliked (${pick('disliked').length}):\n${pick('disliked').join('\n')}`;
	document.getElementById('out').value = txt;
	try { navigator.clipboard.writeText(txt); } catch (e) {}
	document.getElementById('dlg').showModal();
};

// live previews: scale each 1280×800 page down to the card, and only run the ones on screen
function scale() { document.querySelectorAll('.thumb').forEach(t => { const f = t.firstElementChild; f.style.transform = `scale(${t.clientWidth / 1280})`; }); }
addEventListener('resize', scale);
const io = new IntersectionObserver(es => es.forEach(e => {
	const f = e.target.querySelector('iframe'), file = e.target.closest('li').dataset.file;
	if (e.isIntersecting) { if (f.getAttribute('src') !== file) f.src = file; }
	else if (f.getAttribute('src') === file) f.src = 'about:blank';
}), { rootMargin: '300px 0px' });
document.querySelectorAll('.thumb').forEach(t => io.observe(t));
render();
</script>
</body>
</html>
