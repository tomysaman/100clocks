<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>French Decimal Time</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#f1ece0;color:#1f2a44;font-family:Didot,"Bodoni MT",Georgia,serif}
.wrap{height:100%;display:flex;align-items:center;justify-content:center;gap:5vw;flex-wrap:wrap;align-content:center}
svg{width:min(60vw,72vh);height:min(60vw,72vh)}
.side{display:flex;flex-direction:column;gap:1.5vh;max-width:36vw}
.big{font-size:clamp(28px,min(7vw,11vh),120px);font-variant-numeric:tabular-nums}
.l{font-size:clamp(10px,1.8vmin,18px);letter-spacing:.3em;text-transform:uppercase;color:#a33b2b}
.v{font-size:clamp(13px,2.8vmin,28px)}
@media (max-aspect-ratio:1/1){.wrap{flex-direction:column;flex-wrap:nowrap;gap:2vh}svg{width:min(80vw,52vh);height:min(80vw,52vh)}.side{max-width:90vw;text-align:center}}
</style></head><body>
<div class="wrap">
<svg viewBox="-110 -110 220 220">
<circle r="104" fill="#fbf8f0" stroke="#1f2a44" stroke-width="2"/><circle r="98" fill="none" stroke="#a33b2b" stroke-width=".6"/>
<g id="tk"></g><g id="nm" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#1f2a44"></g>
<text y="30" font-size="6" text-anchor="middle" letter-spacing="2" fill="#a33b2b">TEMPS DÉCIMAL</text>
<line id="h" y1="10" y2="-55" stroke="#1f2a44" stroke-width="4" stroke-linecap="round"/>
<line id="m" y1="12" y2="-84" stroke="#1f2a44" stroke-width="2" stroke-linecap="round"/>
<line id="s" y1="16" y2="-90" stroke="#a33b2b" stroke-width=".8"/>
<circle r="3" fill="#a33b2b"/>
</svg>
<div class="side">
<div><div class="l">Heure décimale</div><div class="big" id="dt"></div></div>
<div><div class="l">Calendrier républicain (approx.)</div><div class="v" id="rep"></div></div>
<div><div class="l">Temps ordinaire</div><div class="v" id="std"></div></div>
</div></div>
<script>
const NS="http://www.w3.org/2000/svg",tk=document.getElementById("tk"),nm=document.getElementById("nm");
for(let i=0;i<100;i++){const l=document.createElementNS(NS,'line');l.setAttribute('y1',-98);l.setAttribute('y2',i%10?-94:-88);l.setAttribute('stroke','#1f2a44');l.setAttribute('stroke-width',i%10?.5:1.6);l.setAttribute('transform',`rotate(${i*3.6})`);tk.appendChild(l)}
for(let i=0;i<10;i++){const a=i*Math.PI/5,t=document.createElementNS(NS,'text');t.setAttribute('x',Math.sin(a)*74);t.setAttribute('y',-Math.cos(a)*74);t.textContent=i||10;nm.appendChild(t)}
const MOIS=['Vendémiaire','Brumaire','Frimaire','Nivôse','Pluviôse','Ventôse','Germinal','Floréal','Prairial','Messidor','Thermidor','Fructidor'];
const DEC=['Primidi','Duodi','Tridi','Quartidi','Quintidi','Sextidi','Septidi','Octidi','Nonidi','Décadi'];
const SANS=['Jour de la vertu','Jour du génie','Jour du travail','Jour de l’opinion','Jour des récompenses','Jour de la révolution'];
function rep(d){let y=d.getFullYear(),start=new Date(y,8,22);if(d<start){y--;start=new Date(y,8,22)}
const n=Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate())-start)/864e5),an=y-1791;
if(n>=360)return `${SANS[n-360]||SANS[5]}, an ${an}`;return `${DEC[n%10]} ${n%30+1} ${MOIS[Math.floor(n/30)]}, an ${an}`}
function tick(){const d=new Date(),f=(d.getHours()*3600+d.getMinutes()*60+d.getSeconds()+d.getMilliseconds()/1000)/86400;
const dh=f*10,dm=(dh%1)*100,ds=(dm%1)*100;
h.setAttribute('transform',`rotate(${dh*36})`);m.setAttribute('transform',`rotate(${dm*3.6})`);s.setAttribute('transform',`rotate(${Math.floor(ds)*3.6})`);
document.getElementById('dt').textContent=`${Math.floor(dh)}h ${String(Math.floor(dm)).padStart(2,'0')}m ${String(Math.floor(ds)).padStart(2,'0')}s`;
document.getElementById('rep').textContent=rep(d);
document.getElementById('std').textContent=d.toLocaleString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});requestAnimationFrame(tick)}
const h=document.getElementById('h'),m=document.getElementById('m'),s=document.getElementById('s');
tick();
</script></body></html>
