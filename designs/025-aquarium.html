<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aquarium</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#15110d;font-family:"Segoe UI",system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
</style></head><body>
<canvas id="c"></canvas>
<script>
// A planted "nature" aquarium. Everything inside the tank is drawn in a 1600×900 virtual space:
// backlit backdrop, sand with perspective, seiryu stones, driftwood, vallisneria, sword plants, java fern,
// a schooling group of neon tetras, angelfish and corydoras, animated caustics, light shafts, suspended particles.
// A diver ornament on the sand holds a slate with the time. The tank light dims to blue moonlight at night.
const c=document.getElementById('c'),x=c.getContext('2d');
const VW=1600,VH=900,TAU=Math.PI*2;
let W,H,P,TW,TH,tx,ty,s,stat=null;
const R=(()=>{let v=12345;return()=>(v=(v*16807)%2147483647)/2147483647})();
const sandY=xv=>650-38*Math.sin(xv/520+.6)-14*Math.sin(xv/170+1.3);
function size(){P=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*P;c.height=H*P;
TW=Math.min(W*.94,H*.74*VW/VH);TH=TW*VH/VW;tx=(W-TW)/2;ty=(H-TH)/2-H*.035;s=TW/VW;stat=null}
addEventListener('resize',size);size();

// ---------- caustic tiles (Worley F2−F1 gives the thin bright network) ----------
function causticTile(seed){const N=256,pts=[];let v=seed;const r=()=>(v=(v*16807)%2147483647)/2147483647;for(let i=0;i<20;i++)pts.push([r()*N,r()*N]);
const cv=document.createElement('canvas');cv.width=cv.height=N;const g=cv.getContext('2d'),im=g.createImageData(N,N);
for(let y=0;y<N;y++)for(let X=0;X<N;X++){let d1=1e9,d2=1e9;for(const [px,py] of pts)for(let ox=-N;ox<=N;ox+=N)for(let oy=-N;oy<=N;oy+=N){const dx=X-px-ox,dy=y-py-oy,dd=dx*dx+dy*dy;if(dd<d1){d2=d1;d1=dd}else if(dd<d2)d2=dd}
const e=Math.sqrt(d2)-Math.sqrt(d1),k=Math.max(0,1-e/9),val=Math.pow(k,3);const i=(y*N+X)*4;im.data[i]=230;im.data[i+1]=255;im.data[i+2]=250;im.data[i+3]=val*255}
g.putImageData(im,0,0);return cv}
const CT=[causticTile(77),causticTile(991)];let CP=null;

// ---------- static scene: backdrop, sand, stones, wood, carpet ----------
function buildStatic(){stat=document.createElement('canvas');stat.width=Math.ceil(TW*P);stat.height=Math.ceil(TH*P);const g=stat.getContext('2d');g.setTransform(P*s,0,0,P*s,0,0);const r=(()=>{let v=4242;return()=>(v=(v*16807)%2147483647)/2147483647})();
// backlit frosted backdrop
const bg=g.createLinearGradient(0,0,0,VH);bg.addColorStop(0,'#0c4a6a');bg.addColorStop(.45,'#1f7fa6');bg.addColorStop(.8,'#5cb8d0');bg.addColorStop(1,'#7cc8d8');g.fillStyle=bg;g.fillRect(0,0,VW,VH);
const bl=g.createRadialGradient(VW*.55,VH*.75,0,VW*.55,VH*.75,VW*.7);bl.addColorStop(0,'rgba(200,245,250,.45)');bl.addColorStop(1,'rgba(200,245,250,0)');g.fillStyle=bl;g.fillRect(0,0,VW,VH);
// distant hazy plant silhouettes behind everything
g.filter=`blur(${6*s*P>1?6:3}px)`;g.fillStyle='rgba(20,90,90,.35)';for(let i=0;i<70;i++){const bx=r()*VW,bh=120+r()*260,bw=6+r()*10;g.beginPath();g.moveTo(bx,sandY(bx)+10);g.quadraticCurveTo(bx+(r()-.5)*60,sandY(bx)-bh*.5,bx+(r()-.5)*40,sandY(bx)-bh);g.lineTo(bx+bw,sandY(bx)+10);g.fill()}
g.filter='none';
// sand bed with perspective (back edge higher, front lower)
const sg=g.createLinearGradient(0,560,0,VH);sg.addColorStop(0,'#b8a47e');sg.addColorStop(.3,'#d4c29a');sg.addColorStop(.7,'#c2ac84');sg.addColorStop(1,'#8a7656');g.fillStyle=sg;g.beginPath();g.moveTo(0,VH);for(let xv=0;xv<=VW;xv+=10)g.lineTo(xv,sandY(xv));g.lineTo(VW,VH);g.fill();
g.fillStyle='rgba(0,40,50,.18)';g.beginPath();for(let xv=0;xv<=VW;xv+=10)g.lineTo(xv,sandY(xv));for(let xv=VW;xv>=0;xv-=10)g.lineTo(xv,sandY(xv)+26);g.fill();
// grains: tiny at the back, larger pebbles at the front
for(let i=0;i<9000;i++){const xv=r()*VW,top=sandY(xv),yy=top+Math.pow(r(),.75)*(VH-top),depth=(yy-top)/(VH-top),sz=.6+depth*depth*5.5*r();
const base=[[220,205,170],[190,172,135],[160,140,105],[235,225,200],[140,120,92],[205,180,140]][(r()*6)|0],k=.75+r()*.35;
if(sz>2.2){const pg=g.createRadialGradient(xv-sz*.3,yy-sz*.35,sz*.1,xv,yy,sz);pg.addColorStop(0,`rgb(${base.map(v=>Math.min(255,v*k+45)|0)})`);pg.addColorStop(1,`rgb(${base.map(v=>v*k*.55|0)})`);g.fillStyle=pg;g.beginPath();g.ellipse(xv,yy,sz,sz*.72,r()*3,0,TAU);g.fill()}
else{g.fillStyle=`rgba(${base.map(v=>v*k|0)},.8)`;g.fillRect(xv,yy,sz,sz*.8)}}
// seiryu stones: faceted grey-blue with white veins
const stone=(cx,base,w,h,seed)=>{let v=seed;const q=()=>(v=(v*16807)%2147483647)/2147483647;const pts=[];const n=11;for(let i=0;i<=n;i++){const t=i/n,xx=cx-w/2+t*w,top=base-h*Math.pow(Math.sin(Math.PI*t),.6)*(.75+q()*.35)-(i===5||i===6?h*.18:0);pts.push([xx,top])}
g.fillStyle='rgba(0,30,40,.35)';g.beginPath();g.ellipse(cx+w*.08,base+6,w*.58,h*.08,0,0,TAU);g.fill();
g.beginPath();g.moveTo(cx-w/2,base);pts.forEach(p=>g.lineTo(p[0],p[1]));g.lineTo(cx+w/2,base);g.closePath();const sgr=g.createLinearGradient(cx-w/2,base-h,cx+w/2,base);sgr.addColorStop(0,'#9aa4aa');sgr.addColorStop(.45,'#6a767e');sgr.addColorStop(1,'#2e383e');g.fillStyle=sgr;g.fill();
g.save();g.clip();// facets
for(let i=0;i<9;i++){const fx=cx-w/2+q()*w;g.fillStyle=q()<.5?'rgba(255,255,255,.08)':'rgba(0,0,0,.14)';g.beginPath();g.moveTo(fx,base-h*1.1);g.lineTo(fx+w*(q()*.3-.05),base-h*.2);g.lineTo(fx+w*(q()*.25+.08),base);g.lineTo(fx+w*.12,base-h*.9);g.fill()}
g.strokeStyle='rgba(235,240,240,.55)';g.lineWidth=1.4;for(let i=0;i<6;i++){g.beginPath();let px=cx-w/2+q()*w,py=base-q()*h;g.moveTo(px,py);for(let k=0;k<5;k++){px+=(q()-.5)*w*.15;py+=(q()-.3)*h*.12;g.lineTo(px,py)}g.stroke()}
const sh=g.createLinearGradient(0,base-h,0,base);sh.addColorStop(0,'rgba(220,250,255,.18)');sh.addColorStop(.3,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,20,30,.35)');g.fillStyle=sh;g.fillRect(cx-w,base-h*1.3,w*2,h*1.4);g.restore();
// moss tufts on the shoulders
for(let i=0;i<40;i++){const p=pts[1+(q()*(n-2))|0];g.fillStyle=`rgba(${60+q()*40|0},${120+q()*50|0},${40+q()*20|0},.85)`;g.beginPath();g.arc(p[0]+(q()-.5)*20,p[1]+q()*8,2+q()*4,0,TAU);g.fill()}};
stone(1180,sandY(1180)+40,260,230,11);stone(1330,sandY(1330)+50,150,130,23);stone(1060,sandY(1060)+46,120,90,37);stone(300,sandY(300)+52,170,120,51);stone(420,sandY(420)+56,90,64,63);
// driftwood: branching, with bark texture
const wood=(pts,w0,w1)=>{g.lineCap='round';g.lineJoin='round';const n=pts.length-1,seg=(i,k,dx,dy,col)=>{const wd=(w0+(w1-w0)*i/n)*k;g.strokeStyle=col;g.lineWidth=wd;g.beginPath();g.moveTo(pts[i][0]+dx,pts[i][1]+dy);g.lineTo(pts[i+1][0]+dx,pts[i+1][1]+dy);g.stroke()};
for(let i=0;i<n;i++)seg(i,1.08,4,6,'rgba(0,20,25,.35)');for(let i=0;i<n;i++)seg(i,1,0,0,'#2e1c10');for(let i=0;i<n;i++)seg(i,.78,-1,-1,'#5a3a22');for(let i=0;i<n;i++)seg(i,.42,-w0*.12,-w0*.12,'#8a6440');for(let i=0;i<n;i++)seg(i,.12,-w0*.2,-w0*.2,'rgba(220,190,150,.45)');
// bark fissures following the branch
g.lineWidth=1.3;for(let i=0;i<n;i++){const [ax,ay]=pts[i],[bx,by]=pts[i+1],len=Math.hypot(bx-ax,by-ay),ux=(bx-ax)/len,uy=(by-ay)/len,wd=(w0+(w1-w0)*i/n);for(let k=0;k<len/14;k++){const t0=r(),o=(r()-.5)*wd*.8,l=10+r()*24;g.strokeStyle=r()<.5?'rgba(20,10,4,.55)':'rgba(200,160,120,.25)';g.beginPath();g.moveTo(ax+ux*len*t0-uy*o,ay+uy*len*t0+ux*o);g.lineTo(ax+ux*(len*t0+l)-uy*o,ay+uy*(len*t0+l)+ux*o);g.stroke()}}};
wood([[480,sandY(480)+34],[560,600],[640,530],[700,470],[770,420],[820,330],[850,250],[860,200]],66,14);wood([[700,470],[780,500],[860,480],[930,430],[980,400]],34,9);wood([[600,570],[540,490],[500,420],[470,340],[460,290]],34,8);wood([[770,420],[710,360],[690,300],[700,250]],22,6);wood([[430,sandY(430)+36],[380,620],[330,600]],30,10);
// foreground carpet (dwarf hairgrass)
const cu=g.createLinearGradient(0,VH-90,0,VH);cu.addColorStop(0,'rgba(20,60,20,0)');cu.addColorStop(.3,'rgba(20,60,20,.8)');cu.addColorStop(1,'#163a14');g.fillStyle=cu;g.beginPath();g.moveTo(0,VH);for(let xv=0;xv<=VW;xv+=20)g.lineTo(xv,VH-60-18*Math.sin(xv/90)-10*Math.sin(xv/37));g.lineTo(VW,VH);g.fill();
for(let i=0;i<7000;i++){const xv=r()*VW,by=VH-r()*62,bh=10+r()*34+(VH-by)*.3,lean=(r()-.5)*18,lt=r();g.strokeStyle=`rgb(${30+lt*70|0},${90+lt*110|0},${30+lt*40|0})`;g.lineWidth=1+r()*.8;g.beginPath();g.moveTo(xv,by);g.quadraticCurveTo(xv+lean*.4,by-bh*.6,xv+lean,by-bh);g.stroke()}}

// ---------- plants (drawn each frame so they sway) ----------
const vallis=Array.from({length:80},(_,i)=>({x:20+R()*VW*.97,h:220+R()*340,w:12+R()*10,ph:R()*TAU,c:R()<.5?[60,150,70]:[80,170,80]})).filter(v=>!(v.x>980&&v.x<1450&&R()<.7));
const swords=[{x:250,y:0,n:11,h:200},{x:1470,y:0,n:9,h:170}];
const ludw=[{x:120,n:6},{x:1530,n:5}];
const fern=[[690,300],[700,360],[820,330],[850,250],[880,470],[950,420],[470,340],[500,420]].map(([a,b],i)=>({x:a,y:b,ang:-1.6+((i*1.37)%1.6)-.4,len:70+(i*23)%50,ph:i}));
function drawVallis(t,front){vallis.forEach((v,i)=>{if((i%3===0)!==front)return;const base=sandY(v.x)+12,sw=Math.sin(t/2100+v.ph)*40+Math.sin(t/900+v.ph*2)*10,tipX=v.x+sw,tipY=base-v.h;
const N=24,L=[],Rr=[];for(let k=0;k<=N;k++){const u=k/N,px=v.x+sw*u*u,py=base-v.h*u,twist=Math.abs(Math.cos(u*4+v.ph+t/2600)),wd=v.w*(.35+.65*twist)*(1-u*.4)*.5;L.push([px-wd,py]);Rr.push([px+wd,py])}
const gr=x.createLinearGradient(0,base,0,tipY);gr.addColorStop(0,`rgb(${v.c[0]*.6|0},${v.c[1]*.6|0},${v.c[2]*.6|0})`);gr.addColorStop(1,`rgb(${v.c[0]+40},${v.c[1]+40},${v.c[2]+20})`);x.fillStyle=gr;
x.beginPath();L.forEach((p,k)=>k?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));for(let k=N;k>=0;k--)x.lineTo(Rr[k][0],Rr[k][1]);x.fill();
x.strokeStyle='rgba(220,255,200,.2)';x.lineWidth=1;x.beginPath();L.forEach((p,k)=>{const q=Rr[k];const mx=(p[0]+q[0])/2;k?x.lineTo(mx,p[1]):x.moveTo(mx,p[1])});x.stroke()})}
function leaf(px,py,ang,len,wd,c1,c2,veins){x.save();x.translate(px,py);x.rotate(ang);const g=x.createLinearGradient(0,-wd,0,wd);g.addColorStop(0,c1);g.addColorStop(1,c2);x.fillStyle=g;
x.beginPath();x.moveTo(0,0);x.bezierCurveTo(len*.3,-wd,len*.75,-wd*.8,len,0);x.bezierCurveTo(len*.75,wd*.8,len*.3,wd,0,0);x.fill();
x.strokeStyle='rgba(230,255,210,.35)';x.lineWidth=1.2;x.beginPath();x.moveTo(0,0);x.lineTo(len*.97,0);x.stroke();
if(veins){x.strokeStyle='rgba(10,40,10,.25)';x.lineWidth=.8;for(let k=1;k<7;k++){const u=k/7;x.beginPath();x.moveTo(len*u,0);x.lineTo(len*(u+.08),-wd*.65*Math.sin(Math.PI*u));x.moveTo(len*u,0);x.lineTo(len*(u+.08),wd*.65*Math.sin(Math.PI*u));x.stroke()}}x.restore()}
function drawSwords(t){swords.forEach(sp=>{const by=sandY(sp.x)+20;for(let k=0;k<sp.n;k++){const a=-Math.PI/2+(k/(sp.n-1)-.5)*2.1+Math.sin(t/2400+k)*.05,len=sp.h*(.6+.4*Math.sin(k*1.7+1)**2),ex=sp.x+Math.cos(a)*len*.35,ey=by+Math.sin(a)*len*.35;
x.strokeStyle='#3a7a2a';x.lineWidth=3;x.beginPath();x.moveTo(sp.x,by);x.lineTo(ex,ey);x.stroke();leaf(ex,ey,a,len,len*.16,'#6ec04a','#2e7a26',true)}})}
function drawLudwigia(t){ludw.forEach(l=>{for(let k=0;k<l.n;k++){const bx=l.x+(k-l.n/2)*14,by=sandY(bx)+16,hh=260+((k*53)%90),sw=Math.sin(t/1800+k)*14;x.strokeStyle='#6a4a2a';x.lineWidth=2.2;x.beginPath();x.moveTo(bx,by);x.quadraticCurveTo(bx+sw*.5,by-hh*.5,bx+sw,by-hh);x.stroke();
for(let j=1;j<15;j++){const u=j/15,lx=bx+sw*u*u,ly=by-hh*u,red=u;const c1=`rgb(${(90+red*150)|0},${(150-red*90)|0},${(60-red*20)|0})`,c2=`rgb(${(40+red*110)|0},${(90-red*60)|0},${(30)|0})`;
leaf(lx,ly,-.5-u*.3,16+u*6,6,c1,c2,false);leaf(lx,ly,Math.PI+.5+u*.3,16+u*6,6,c1,c2,false)}}})}
function drawFern(t){fern.forEach(f=>{const a=f.ang+Math.sin(t/2000+f.ph)*.08;leaf(f.x,f.y,a,f.len,f.len*.17,'#4a8a3a','#1e4a1a',true);leaf(f.x,f.y,a+.5,f.len*.8,f.len*.15,'#3e7a32','#1a3e16',true)})}

// ---------- fish ----------
function fishPath(len,prof,ph,amp,N){const top=[],bot=[];for(let i=0;i<=N;i++){const t=i/N,xx=len/2-t*len,yc=Math.sin(ph-t*3.2)*amp*t*t,w=prof(t)*len;top.push([xx,yc-w]);bot.push([xx,yc+w])}return {top,bot,yc:t=>Math.sin(ph-t*3.2)*amp*t*t}}
function outline(fp){x.beginPath();fp.top.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));for(let i=fp.bot.length-1;i>=0;i--)x.lineTo(fp.bot[i][0],fp.bot[i][1]);x.closePath()}
function tail(fp,len,spread,col){const e=fp.top.length-1,tx0=fp.top[e][0],ty0=(fp.top[e][1]+fp.bot[e][1])/2,yy=fp.yc(1.25)-fp.yc(1);x.fillStyle=col;x.beginPath();x.moveTo(tx0+len*.02,ty0);x.quadraticCurveTo(tx0-len*.12,ty0-len*spread*.6,tx0-len*.24,ty0-len*spread+yy);x.quadraticCurveTo(tx0-len*.14,ty0+yy*.5,tx0-len*.24,ty0+len*spread+yy);x.quadraticCurveTo(tx0-len*.12,ty0+len*spread*.6,tx0+len*.02,ty0);x.fill();
x.strokeStyle='rgba(255,255,255,.15)';x.lineWidth=.6;for(let k=-3;k<=3;k++){x.beginPath();x.moveTo(tx0,ty0);x.lineTo(tx0-len*.22,ty0+k*len*spread/3+yy);x.stroke()}}
function eye(px,py,r){x.fillStyle='#e8e4d0';x.beginPath();x.arc(px,py,r,0,TAU);x.fill();x.fillStyle='#0a0a0a';x.beginPath();x.arc(px+r*.15,py,r*.62,0,TAU);x.fill();x.fillStyle='rgba(255,255,255,.9)';x.beginPath();x.arc(px-r*.15,py-r*.3,r*.22,0,TAU);x.fill()}
const neonProf=t=>.115*Math.pow(Math.sin(Math.PI*Math.min(1,.12+t*.95)),.75)*(1-.5*t)+.012;
function neon(len,ph,amp,t){const fp=fishPath(len,neonProf,ph,amp,18);
tail(fp,len,.17,'rgba(200,215,220,.35)');
// dorsal and anal fins
x.fillStyle='rgba(210,220,225,.35)';const d=fp.top[8];x.beginPath();x.moveTo(d[0]+len*.06,d[1]);x.lineTo(d[0]-len*.02,d[1]-len*.09);x.lineTo(d[0]-len*.1,d[1]+len*.01);x.fill();const a=fp.bot[11];x.beginPath();x.moveTo(a[0]+len*.12,a[1]);x.lineTo(a[0]-len*.04,a[1]+len*.07);x.lineTo(a[0]-len*.1,a[1]-len*.01);x.fill();
outline(fp);const g=x.createLinearGradient(0,-len*.12,0,len*.12);g.addColorStop(0,'#5a6a6e');g.addColorStop(.45,'#c8d4d4');g.addColorStop(1,'#f4f4ee');x.fillStyle=g;x.fill();
x.save();outline(fp);x.clip();
// red rear belly
x.fillStyle='#e8263a';x.beginPath();for(let i=8;i<=18;i++){const p=fp.bot[i],c=fp.yc(i/18);x.lineTo(p[0],c+(p[1]-c)*.05)}for(let i=18;i>=8;i--)x.lineTo(fp.bot[i][0],fp.bot[i][1]+2);x.fill();
// iridescent blue stripe, shimmer with angle
const sh=.5+.5*Math.sin(t/400+ph),bc=`rgb(${(20+sh*40)|0},${(160+sh*90)|0},${(220+sh*35)|0})`;x.strokeStyle=bc;x.lineWidth=len*.055;x.lineCap='round';x.shadowColor=bc;x.shadowBlur=len*.12;x.beginPath();for(let i=2;i<=15;i++){const p=fp.top[i],c=fp.yc(i/18);i===2?x.moveTo(p[0],c-(c-p[1])*.18):x.lineTo(p[0],c-(c-p[1])*.18)}x.stroke();x.shadowBlur=0;
x.fillStyle='rgba(255,255,255,.18)';x.beginPath();x.ellipse(len*.1,-len*.06,len*.25,len*.02,0,0,TAU);x.fill();x.restore();
eye(len*.36,-len*.012+fp.yc(.14),len*.042)}
const angelProf=t=>.36*Math.pow(Math.sin(Math.PI*Math.min(1,.06+t*.9)),.85)*(1-.25*t)+.02;
function angel(len,ph,amp,t){const fp=fishPath(len,angelProf,ph,amp*.5,18);
// long sweeping dorsal and anal fins
const sweep=Math.sin(ph-2)*len*.04,fin='rgba(200,210,205,.28)';x.fillStyle=fin;
x.beginPath();x.moveTo(fp.top[4][0],fp.top[4][1]);x.quadraticCurveTo(fp.top[10][0],fp.top[10][1]-len*.42,fp.top[17][0]-len*.26+sweep,fp.top[17][1]-len*.5);x.quadraticCurveTo(fp.top[16][0]-len*.05,fp.top[14][1]-len*.05,fp.top[17][0],fp.top[17][1]);x.closePath();x.fill();
x.beginPath();x.moveTo(fp.bot[5][0],fp.bot[5][1]);x.quadraticCurveTo(fp.bot[10][0],fp.bot[10][1]+len*.42,fp.bot[17][0]-len*.24+sweep,fp.bot[17][1]+len*.52);x.quadraticCurveTo(fp.bot[16][0]-len*.05,fp.bot[14][1]+len*.05,fp.bot[17][0],fp.bot[17][1]);x.closePath();x.fill();
// fin rays and dark fin edges
