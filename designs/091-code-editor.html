<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Editor</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1e1e1e;color:#d4d4d4;font-family:"Cascadia Code","Consolas",monospace}
.app{position:fixed;inset:0;display:grid;grid-template-columns:min(22vw,260px) 1fr;grid-template-rows:max(4.5vh,28px) 1fr max(3.2vh,20px)}
.tabs{grid-column:2;background:#252526;display:flex;align-items:flex-end;font-size:clamp(10px,1.6vh,14px)}
.tabs span{padding:5px 2vw;background:#1e1e1e;color:#fff;border-top:2px solid #0078d4}
.tabs span+span{background:#2d2d2d;color:#969696;border-top-color:transparent}
.side{grid-row:1/3;background:#252526;padding:1.5vh 1vw;font-size:clamp(10px,1.7vh,15px);color:#ccc;line-height:1.9;overflow:hidden}
.side b{display:block;font-size:.8em;color:#bbb;letter-spacing:.1em;margin-bottom:.5vh}
.side .a{background:#37373d;color:#fff;margin:0 -1vw;padding:0 1vw}
.ed{grid-column:2;display:flex;min-width:0;font-size:clamp(11px,min(2.6vh,1.9vw),26px);line-height:1.6;padding-top:1.5vh;overflow:hidden}
.ln{color:#858585;text-align:right;padding:0 1.5vw 0 1vw;user-select:none}
pre{margin:0;font:inherit;white-space:pre}
.k{color:#9cdcfe}.s{color:#ce9178}.n{color:#b5cea8}.c{color:#6a9955}.p{color:#da70d6}.f{color:#dcdcaa}.kw{color:#569cd6}
.cur{display:inline-block;width:2px;height:1.2em;background:#aeafad;vertical-align:text-bottom;animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
.st{grid-column:1/3;white-space:nowrap;overflow:hidden;gap:2vw;background:#007acc;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 1vw;font-size:clamp(10px,1.6vh,14px)}
@media (max-aspect-ratio:1/1){.st span:last-child{display:none}.app{grid-template-columns:0 1fr}.side{display:none}.ed{font-size:clamp(9px,2.6vw,16px)}}
</style></head><body>
<div class="app">
<div class="side"><b>EXPLORER</b>▾ CLOCK<br><span class="a">&nbsp;&nbsp;{ } now.json</span><br>&nbsp;&nbsp;JS time.js<br>&nbsp;&nbsp;📄 README.md<br>&nbsp;&nbsp;⚙ package.json</div>
<div class="tabs"><span>{ } now.json</span><span>JS time.js</span></div>
<div class="ed"><div class="ln" id="ln"></div><pre id="code"></pre></div>
<div class="st"><span>⎇ main ✓</span><span id="pos"></span><span>JSON · UTF-8 · LF</span></div>
</div>
<script>
const K=s=>`<span class="k">"${s}"</span>`,S=s=>`<span class="s">"${s}"</span>`,N=n=>`<span class="n">${n}</span>`,P=s=>`<span class="p">${s}</span>`;
function tick(){const d=new Date(),p=n=>String(n).padStart(2,'0'),y=d.getFullYear(),doy=Math.floor((new Date(y,d.getMonth(),d.getDate())-new Date(y,0,0))/864e5);
const lines=[`<span class="c">// live view of right now — saved automatically</span>`,P('{'),
`  ${K('time')}: ${S(p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()))},`,
`  ${K('hours')}: ${N(d.getHours())},`,`  ${K('minutes')}: ${N(d.getMinutes())},`,`  ${K('seconds')}: ${N(d.getSeconds())},`,
`  ${K('date')}: ${P('{')}`,`    ${K('weekday')}: ${S(d.toLocaleDateString('en',{weekday:'long'}))},`,`    ${K('day')}: ${N(d.getDate())},`,`    ${K('month')}: ${S(d.toLocaleDateString('en',{month:'long'}))},`,`    ${K('year')}: ${N(y)},`,`    ${K('dayOfYear')}: ${N(doy)}`,`  ${P('}')},`,
`  ${K('iso')}: ${S(d.toISOString())},`,`  ${K('epoch')}: ${N(Math.floor(d/1000))},`,`  ${K('timezone')}: ${S(Intl.DateTimeFormat().resolvedOptions().timeZone)},`,`  ${K('isWeekend')}: <span class="kw">${d.getDay()%6===0}</span>`,P('}')+'<span class="cur"></span>'];
document.getElementById('code').innerHTML=lines.join('\n');document.getElementById('ln').innerHTML=lines.map((_,i)=>i+1).join('<br>');
document.getElementById('pos').textContent=`Ln ${lines.length}, Col 2 · ${d.toLocaleTimeString()}`}
tick();setInterval(tick,1000);
</script></body></html>
