<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swiss Railway</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#5a6670;font-family:Arial,Helvetica,sans-serif}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vmin}
svg{width:min(84vw,76vh);height:min(84vw,76vh);filter:drop-shadow(0 2vmin 3vmin rgba(0,0,0,.4))}
.sign{background:#fff;color:#111;padding:.8vmin 2.4vmin;font-weight:bold;font-size:clamp(13px,2.8vmin,28px);border-radius:.5vmin;letter-spacing:.05em}
.sign b{background:#d4001a;color:#fff;padding:0 1vmin;margin-right:1.5vmin;border-radius:.3vmin}
</style></head><body>
<div class="wrap">
<svg viewBox="-110 -110 220 220">
<circle r="108" fill="#222"/><circle r="104" fill="#fff"/>
<g id="tk"></g>
<rect id="h" x="-4.5" y="-60" width="9" height="78" fill="#111"/>
<rect id="m" x="-3.5" y="-92" width="7" height="112" fill="#111"/>
<g id="s"><rect x="-1.1" y="-62" width="2.2" height="90" fill="#d4001a"/><circle cy="-62" r="9.5" fill="#d4001a"/></g>
</svg>
<div class="sign"><b>SBB</b><span id="d"></span></div></div>
<script>
const NS="http://www.w3.org/2000/svg",tk=document.getElementById('tk');
for(let i=0;i<60;i++){const r=document.createElementNS(NS,'rect'),b=i%5==0;r.setAttribute('x',b?-3.5:-1.2);r.setAttribute('y',-98);r.setAttribute('width',b?7:2.4);r.setAttribute('height',b?24:7);r.setAttribute('fill','#111');r.setAttribute('transform',`rotate(${i*6})`);tk.appendChild(r)}
const H=document.getElementById('h'),M=document.getElementById('m'),S=document.getElementById('s'),D=document.getElementById('d');
// Second hand sweeps the dial in 58.5 s, waits at 12, then the minute hand jumps.
function tick(){const d=new Date(),sec=d.getSeconds()+d.getMilliseconds()/1000,mi=d.getMinutes(),h=d.getHours()%12+mi/60;
S.setAttribute('transform',`rotate(${Math.min(sec/58.5,1)*360})`);
const jump=Math.min(sec/.15,1);M.setAttribute('transform',`rotate(${(mi-1+jump)*6})`);H.setAttribute('transform',`rotate(${h*30})`);
D.textContent=d.toLocaleDateString(undefined,{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});requestAnimationFrame(tick)}
tick();
</script></body></html>
