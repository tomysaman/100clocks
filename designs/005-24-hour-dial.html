<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>24-Hour Dial</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:"Palatino Linotype",Palatino,Georgia,serif}
body{background:radial-gradient(ellipse at 50% 40%,#3a4a5a,#121820 75%)}
svg{position:fixed;inset:0;width:100%;height:100%}
</style></head><body>
<svg viewBox="-130 -125 260 270" preserveAspectRatio="xMidYMid meet">
<defs>
<linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2c0"/><stop offset=".25" stop-color="#c9a24a"/><stop offset=".5" stop-color="#f0d68a"/><stop offset=".75" stop-color="#7a5a18"/><stop offset="1" stop-color="#d9b25a"/></linearGradient>
<linearGradient id="brass2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8c870"/><stop offset=".5" stop-color="#6a4a10"/><stop offset="1" stop-color="#f4dc8a"/></linearGradient>
<radialGradient id="enamel" cx="50%" cy="40%"><stop offset="0" stop-color="#fbf8ef"/><stop offset="1" stop-color="#e8e0cc"/></radialGradient>
<linearGradient id="skyDisc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4aa0e8"/><stop offset=".38" stop-color="#9ccff4"/><stop offset=".46" stop-color="#f6b46a"/><stop offset=".5" stop-color="#e2705a"/><stop offset=".54" stop-color="#3a3070"/><stop offset=".65" stop-color="#141c48"/><stop offset="1" stop-color="#070b22"/></linearGradient>
<linearGradient id="lake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" id="lk0" stop-color="#3a6a8a"/><stop offset="1" stop-color="#0c1a26"/></linearGradient>
<radialGradient id="sun" cx="40%" cy="40%"><stop offset="0" stop-color="#fffbe0"/><stop offset=".5" stop-color="#ffd84a"/><stop offset="1" stop-color="#e89a10"/></radialGradient>
<radialGradient id="moon" cx="40%" cy="35%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c8ccd8"/></radialGradient>
<radialGradient id="glass" cx="32%" cy="25%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".3" stop-color="#fff" stop-opacity=".06"/><stop offset=".7" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".2"/></radialGradient>
<filter id="ds" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="4" dy="10" stdDeviation="8" flood-color="#000" flood-opacity=".6"/></filter>
<filter id="hs" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="1.2" dy="2" stdDeviation="1" flood-color="#000" flood-opacity=".5"/></filter>
<clipPath id="win"><circle r="58"/></clipPath>
</defs>
<g filter="url(#ds)">
<circle r="118" fill="url(#brass)"/><circle r="110" fill="url(#brass2)"/><circle r="105" fill="url(#brass)"/>
</g>
<g id="screws"></g>
<circle r="100" fill="url(#enamel)"/>
<!-- rotating sky disc seen through the centre window -->
<g clip-path="url(#win)"><g id="disc"><circle r="70" fill="url(#skyDisc)"/><g id="stars"></g>
<circle cx="0" cy="-42" r="11" fill="url(#sun)"/><g stroke="#ffd84a" stroke-width="1.2" opacity=".7" id="rays"></g>
<g transform="translate(0 42)"><circle r="9" fill="url(#moon)"/><circle cx="4" cy="-2" r="7.5" fill="#141c48" opacity=".9"/></g>
<g fill="#f2f4fa" opacity=".85"><path d="M-30 -14 q6 -6 12 0 q6 -4 10 1 q-11 3 -22 -1z"/><path d="M14 -24 q5 -5 10 0 q5 -3 8 1 q-9 2 -18 -1z"/></g></g>
<path d="M-70 4 Q-40 -6 -20 2 Q0 -8 22 2 Q44 -6 70 4 L70 70 L-70 70Z" fill="#2a3a28" opacity=".0"/></g>
<circle r="58" fill="none" stroke="url(#brass)" stroke-width="2.4"/>
<!-- horizon line across the window -->
<path d="M-58 2 Q-30 -4 -10 2 Q12 -6 32 1 Q46 -3 58 2 L58 8 L-58 8Z" fill="#1c2a1c"/><g clip-path="url(#win)"><rect x="-58" y="7" width="116" height="53" fill="url(#lake)"/><g id="ripples" stroke="#fff" stroke-opacity=".18" stroke-width=".6"></g></g>
<g id="ticks"></g><g id="nums" font-size="10" text-anchor="middle" dominant-baseline="central" font-family="'Palatino Linotype',serif"></g>
<text y="44" text-anchor="middle" font-size="4.6" fill="#cfd8e8" letter-spacing="2" opacity=".75">24 · HOUR · DIAL</text>
<text y="-70" text-anchor="middle" font-size="4.4" fill="#5a4a30" letter-spacing="1.6">NOON</text><text y="92" text-anchor="middle" font-size="4.4" fill="#5a4a30" letter-spacing="1.6" opacity="0">MIDNIGHT</text>
<!-- hands -->
<g id="hh" filter="url(#hs)"><path d="M-2.6 14 L-1.6 -60 L0 -76 L1.6 -60 L2.6 14Z" fill="#1b2340"/><path d="M0 -76 L-5 -64 L0 -68 L5 -64Z" fill="#c0392b"/></g>
<g id="mh" filter="url(#hs)"><path d="M-1.6 16 L-1 -86 L0 -92 L1 -86 L1.6 16Z" fill="#1b2340"/></g>
<circle r="4" fill="url(#brass)"/><circle r="1.4" fill="#5a4a30"/>
<circle r="100" fill="url(#glass)"/>
<path d="M-78 -40 A88 88 0 0 1 -20 -86" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2.4" stroke-linecap="round"/>
<text id="t" y="134" text-anchor="middle" font-size="11" fill="#d8e2ec" letter-spacing="2"></text>
</svg>
<script>
const NS="http://www.w3.org/2000/svg",$=id=>document.getElementById(id);
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
for(let i=0;i<8;i++){const a=i/8*Math.PI*2,g=el('g',{transform:`translate(${Math.sin(a)*112.5} ${-Math.cos(a)*112.5}) rotate(${i*37})`},$('screws'));el('circle',{r:3.2,fill:'url(#brass2)'},g);el('line',{x1:-2.4,x2:2.4,stroke:'#4a3410','stroke-width':.9},g)}
for(let i=0;i<96;i++)el('line',{y1:-98,y2:i%4?-95:-90,stroke:'#2a2418','stroke-width':i%4?.5:1.3,transform:`rotate(${i*3.75})`},$('ticks'));
// 24 numerals, noon at the top; night hours in navy, day hours in deep red
for(let i=0;i<24;i++){const a=(i-12)/24*Math.PI*2,day=i>=6&&i<18;el('text',{x:Math.sin(a)*80,y:-Math.cos(a)*80,fill:day?'#8a2a1a':'#1b2340','font-weight':i%6===0?'bold':'normal'},$('nums')).textContent=i}
for(let i=0;i<40;i++){const a=Math.PI*(1+Math.random()),r=12+Math.random()*55;el('circle',{cx:Math.cos(a)*r*-1,cy:Math.abs(Math.sin(a)*r)+6,r:.4+Math.random()*.7,fill:'#fff'},$('stars'))}
for(let i=0;i<12;i++){const a=i/12*Math.PI*2;el('line',{x1:Math.cos(a)*14,y1:-42+Math.sin(a)*14,x2:Math.cos(a)*18,y2:-42+Math.sin(a)*18},$('rays'))}
for(let i=0;i<14;i++){const y=11+i*3.4,w=10+Math.random()*30,x0=-50+Math.random()*80;el('line',{x1:x0,x2:x0+w,y1:y,y2:y},$('ripples'))}
function tick(){const d=new Date(),s=d.getSeconds()+d.getMilliseconds()/1000,m=d.getMinutes()+s/60,h=d.getHours()+m/60;
// the hour hand turns once a day (noon at top); the sky disc turns so the sun is overhead at noon and the moon at midnight
$('hh').setAttribute('transform',`rotate(${(h-12)*15})`);$('mh').setAttribute('transform',`rotate(${m*6})`);$('disc').setAttribute('transform',`rotate(${(h-12)*15})`);const day=Math.max(0,Math.cos((h-12)/24*Math.PI*2));$('lk0').setAttribute('stop-color',`rgb(${Math.round(20+60*day)},${Math.round(30+90*day)},${Math.round(60+100*day)})`);
$('t').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})+' · '+d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'});requestAnimationFrame(tick)}
tick();
</script></body></html>
