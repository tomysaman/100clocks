<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mondrian</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111}
.g{position:fixed;inset:0;display:grid;gap:1.4vmin;background:#111;padding:1.4vmin;box-sizing:border-box;
grid-template-columns:3fr 1fr 2fr 1.2fr;grid-template-rows:2fr 1fr 1.4fr 1fr}
.g div{background:#f4f1e8;display:flex;align-items:center;justify-content:center;font-family:"Futura","Century Gothic",Arial,sans-serif;font-weight:bold;color:#111;transition:background 1s;overflow:hidden}
.r{background:#d72a1f!important;color:#fff!important}.b{background:#1e4fa0!important;color:#fff!important}.y{background:#f2c81f!important}
.hh{grid-column:1/2;grid-row:1/3;font-size:min(22vw,34vh)}
.mm{grid-column:3/5;grid-row:3/5;font-size:min(18vw,26vh)}
.ss{grid-column:4/5;grid-row:2/3;font-size:min(5vw,8vh)}
.dt{grid-column:2/4;grid-row:1/2;font-size:min(3vw,4.5vh);flex-direction:column;letter-spacing:.1em}
.dt small{font-size:.6em;font-weight:normal;margin-top:.5em}
</style></head><body>
<div class="g" id="g">
<div class="hh" id="h"></div><div class="dt" id="d"></div><div style="grid-column:4/5;grid-row:1/2" class="c"></div>
<div style="grid-column:2/3;grid-row:2/3" class="c"></div><div style="grid-column:3/4;grid-row:2/3" class="c"></div><div class="ss" id="s"></div>
<div style="grid-column:1/2;grid-row:3/5" class="c"></div><div style="grid-column:2/3;grid-row:3/4" class="c"></div><div style="grid-column:2/3;grid-row:4/5" class="c"></div>
<div class="mm" id="m"></div>
</div>
<script>
const COL=['r','b','y','',''];let lastM=-1;
function tick(){const d=new Date(),p=n=>String(n).padStart(2,'0');
document.getElementById('h').textContent=p(d.getHours());document.getElementById('m').textContent=p(d.getMinutes());document.getElementById('s').textContent=p(d.getSeconds());
document.getElementById('d').innerHTML=d.toLocaleDateString(undefined,{weekday:'long'}).toUpperCase()+`<small>${d.toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'})}</small>`;
if(d.getMinutes()!==lastM){lastM=d.getMinutes();// recompose colors every minute, seeded by the minute
let s=d.getHours()*60+d.getMinutes();const rnd=()=>{s=(s*9301+49297)%233280;return s/233280};
const cells=[...document.querySelectorAll('.c'),document.getElementById('h'),document.getElementById('m'),document.getElementById('s')];cells.forEach(c=>c.classList.remove('r','b','y'));
document.getElementById('h').classList.add('r');document.getElementById('m').classList.add(['b','y','r'][Math.floor(rnd()*3)]==='r'?'b':'y');
document.querySelectorAll('.c').forEach(c=>{const k=COL[Math.floor(rnd()*COL.length)];if(k)c.classList.add(k)})}}
tick();setInterval(tick,500);
</script></body></html>
