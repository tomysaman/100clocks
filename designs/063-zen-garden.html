<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zen Garden</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#2a2622 repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 2px,transparent 2px 9px);font-family:"Yu Mincho",Georgia,serif}
.frame{position:fixed;inset:1.6vmin;padding:2.4vmin;border-radius:.6vmin;box-sizing:border-box;background:linear-gradient(90deg,rgba(0,0,0,.3),transparent 2%,transparent 98%,rgba(0,0,0,.3)),linear-gradient(rgba(0,0,0,.3),transparent 3%,transparent 97%,rgba(0,0,0,.35)),repeating-linear-gradient(90deg,#6e5236 0 5px,#62482e 5px 11px,#7a5c3e 11px 14px);box-shadow:0 1vmin 3vmin rgba(0,0,0,.6),inset 0 0 0 .3vmin #3a2a1a}
.sand{position:relative;width:100%;height:100%;overflow:hidden;box-shadow:inset 0 .6vmin 2vmin rgba(60,40,10,.55);border-radius:.3vmin}
canvas{position:absolute;inset:0;width:100%;height:100%}
.plaque{position:fixed;right:6vmin;bottom:6vmin;background:linear-gradient(#7a5a3a,#5a4028);color:#f3e6c8;padding:1.4vmin 2.4vmin;border-radius:.6vmin;box-shadow:0 .6vmin 1.4vmin rgba(0,0,0,.45);text-align:right;font-size:clamp(11px,2.2vmin,22px);line-height:1.5}
.plaque b{display:block;font-size:1.5em;font-weight:normal;letter-spacing:.1em}
</style></head><body>
<div class="frame"><div class="sand"><canvas id="c"></canvas></div></div>
<div class="plaque"><b id="s"></b><span id="d"></span></div>
<script>
// Raked sand. The time is raked in a different direction from the background so it reads as grooves;
// three stones sit in their own ripple rings. The garden is re-raked once a minute.
const c=document.getElementById('c'),x=c.getContext('2d'),mask=document.createElement('canvas'),mx=mask.getContext('2d');
let W,H,last='';
function size(){const b=c.getBoundingClientRect(),p=Math.min(devicePixelRatio||1,2);W=c.width=Math.round(b.width*p);H=c.height=Math.round(b.height*p);last=''}
addEventListener('resize',()=>{size();draw()});size();
function rnd(s){const v=Math.sin(s*9301.7+49.3)*43758.5453;return v-Math.floor(v)}
function draw(){const d=new Date(),p=n=>String(n).padStart(2,'0'),t=p(d.getHours())+':'+p(d.getMinutes());
document.getElementById('s').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
document.getElementById('d').textContent=d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
if(t===last)return;last=t;
const sp=Math.max(6,Math.min(W,H)/70),seed=d.getHours()*60+d.getMinutes();
// sand base
const g=x.createRadialGradient(W*.4,H*.35,0,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'#efe5cc');g.addColorStop(1,'#d9caa6');x.fillStyle=g;x.fillRect(0,0,W,H);
// time mask
mask.width=W;mask.height=H;const fs=Math.min(W/3.7,H/2.3);mx.fillStyle='#000';mx.font=`900 ${fs}px "Arial Black","Segoe UI Black",sans-serif`;mx.textAlign='center';mx.textBaseline='middle';mx.fillText(t,W/2,H*.47);
const md=mx.getImageData(0,0,W,H).data,inText=(X,Y)=>X>=0&&Y>=0&&X<W&&Y<H&&md[((Y|0)*W+(X|0))*4+3]>100;
// stones (kept clear of the digits)
const stones=[];for(let k=0;k<40&&stones.length<3;k++){const r=Math.min(W,H)*(.045+rnd(seed+k)*.04),sx=W*(.08+rnd(seed*3+k)*.84),sy=H*(.1+rnd(seed*7+k)*.8);
let ok=!stones.some(s=>Math.hypot(s.x-sx,s.y-sy)<(s.r+r)*3.2)&&!(sx+r*1.4>W*.62&&sy+r>H*.72)&&!(sx-r*1.4<W*.34&&sy+r>H*.66);for(let a=0;a<24&&ok;a++)for(const f of [1.2,2.2,2.9])if(inText(sx+Math.cos(a/24*6.28)*r*f*1.4,sy+Math.sin(a/24*6.28)*r*f))ok=false;if(ok)stones.push({x:sx,y:sy,r})}
const nearStone=(X,Y)=>stones.some(s=>Math.hypot((X-s.x)/1.35,Y-s.y)<s.r*2.9);
// background rake: horizontal wavy lines that skip the digits and stone rings
for(let y=sp;y<H;y+=sp){let on=false;x.beginPath();for(let X=0;X<=W;X+=4){const Y=y+Math.sin(X/W*Math.PI*2+y*.01)*sp*.35;const skip=inText(X,Y)||nearStone(X,Y);if(skip){on=false;continue}if(!on){x.moveTo(X,Y);on=true}else x.lineTo(X,Y)}x.lineCap='round';x.strokeStyle='rgba(120,95,55,.4)';x.lineWidth=sp*.32;x.stroke();x.save();x.translate(0,-sp*.3);x.strokeStyle='rgba(255,252,240,.45)';x.lineWidth=sp*.16;x.stroke();x.restore()}
// digits: diagonal grooves inside the mask, with a darker rim for depth
x.save();x.beginPath();for(let Y=0;Y<H;Y+=2){let s=-1;for(let X=0;X<=W;X+=2){const i=inText(X,Y);if(i&&s<0)s=X;if(!i&&s>=0){x.rect(s,Y,X-s,2);s=-1}}}x.clip();
x.fillStyle='rgba(180,155,110,.35)';x.fillRect(0,0,W,H);
for(let k=-H;k<W;k+=sp*.8){x.beginPath();x.moveTo(k,0);x.lineTo(k+H*.6,H);x.strokeStyle='rgba(110,85,45,.45)';x.lineWidth=sp*.28;x.stroke();x.beginPath();x.moveTo(k+sp*.25,0);x.lineTo(k+sp*.25+H*.6,H);x.strokeStyle='rgba(255,250,235,.5)';x.lineWidth=sp*.14;x.stroke()}
x.restore();
x.save();x.globalCompositeOperation='multiply';x.shadowColor='rgba(90,65,30,.6)';x.shadowBlur=sp*.8;x.strokeStyle='rgba(150,120,80,.5)';x.lineWidth=sp*.25;x.font=mx.font;x.textAlign='center';x.textBaseline='middle';x.strokeText(t,W/2,H*.47);x.restore();
// ripple rings and stones
stones.forEach((s,i)=>{for(let k=1;k<=4;k++){const rr=s.r*(1.05+k*.42);x.beginPath();x.ellipse(s.x,s.y,rr*1.35,rr,0,0,7);x.strokeStyle='rgba(120,95,55,.38)';x.lineWidth=sp*.32;x.stroke()}
x.save();x.shadowColor='rgba(40,30,15,.5)';x.shadowBlur=s.r*.6;x.shadowOffsetY=s.r*.25;const sg=x.createRadialGradient(s.x-s.r*.4,s.y-s.r*.4,s.r*.1,s.x,s.y,s.r*1.3);sg.addColorStop(0,['#9a9488','#7d776b','#8a8070'][i]);sg.addColorStop(1,'#3e3a33');x.fillStyle=sg;
const shape=()=>{x.beginPath();for(let a=0;a<=48;a++){const an=a/48*Math.PI*2,rr=s.r*(1+.12*Math.sin(an*3+seed+i)+.04*Math.sin(an*7+i));x.lineTo(s.x+Math.cos(an)*rr*1.3,s.y+Math.sin(an)*rr)}x.closePath()};shape();x.fill();x.restore();
x.save();shape();x.clip();for(let k=0;k<s.r*6;k++){const a=rnd(seed*13+i*101+k)*6.28,rr=Math.sqrt(rnd(seed*17+i*7+k))*s.r*1.3;x.fillStyle=k%3?'rgba(0,0,0,.18)':'rgba(255,255,255,.14)';x.beginPath();x.arc(s.x+Math.cos(a)*rr*1.2,s.y+Math.sin(a)*rr*.9,s.r*(.02+rnd(k+i)*.03),0,7);x.fill()}
const mg=x.createRadialGradient(s.x-s.r*.3,s.y-s.r*.55,0,s.x-s.r*.3,s.y-s.r*.55,s.r*.9);mg.addColorStop(0,'rgba(92,130,52,.85)');mg.addColorStop(.6,'rgba(70,104,40,.45)');mg.addColorStop(1,'rgba(70,104,40,0)');x.fillStyle=mg;x.fillRect(s.x-s.r*2,s.y-s.r*2,s.r*4,s.r*4);
for(let k=0;k<40;k++){const a=rnd(seed+k*3+i)*6.28,rr=rnd(k*5+i)*s.r*.7;x.fillStyle='rgba(120,160,70,.55)';x.beginPath();x.arc(s.x-s.r*.3+Math.cos(a)*rr,s.y-s.r*.55+Math.sin(a)*rr*.6,s.r*.04,0,7);x.fill()}
x.restore();x.save();shape();x.strokeStyle='rgba(255,255,255,.15)';x.lineWidth=Math.max(1,s.r*.04);x.stroke();x.restore()});
// fallen maple leaves, clear of the digits and stones
let placed=0;for(let k=0;k<60&&placed<4;k++){const lx=W*(.05+rnd(seed*31+k)*.9),ly=H*(.06+rnd(seed*37+k)*.88),ls=Math.min(W,H)*.035;if([0,1,2,3,4,5,6,7].some(q=>inText(lx+Math.cos(q*.785)*ls*1.3,ly+Math.sin(q*.785)*ls*1.3))||inText(lx,ly)||nearStone(lx,ly)||(lx>W*.62&&ly>H*.72)||(lx<W*.34&&ly>H*.66))continue;placed++;
x.save();x.translate(lx,ly);x.rotate(rnd(k*7)*6.28);x.shadowColor='rgba(60,40,10,.4)';x.shadowBlur=ls*.3;x.shadowOffsetY=ls*.15;const lg=x.createRadialGradient(0,0,0,0,0,ls);const hue=rnd(k*11);lg.addColorStop(0,hue<.5?'#e8a020':'#d84a18');lg.addColorStop(1,hue<.5?'#c0441a':'#8a1a10');x.fillStyle=lg;x.beginPath();
for(let a=0;a<=60;a++){const an=a/60*Math.PI*2-Math.PI/2,lobe=Math.abs(Math.sin(an*2.5)),r=ls*(.32+.68*Math.pow(lobe,2.4)+.05*Math.abs(Math.sin(an*18)))*(an>Math.PI*.35&&an<Math.PI*.65?.35:1);x.lineTo(Math.cos(an)*r,Math.sin(an)*r)}x.fill();x.shadowColor='transparent';
x.strokeStyle='rgba(90,20,5,.6)';x.lineWidth=Math.max(1,ls*.04);for(const an of [-90,-18,54,126,198]){const a=an*Math.PI/180;x.beginPath();x.moveTo(0,0);x.lineTo(Math.cos(a)*ls*.85,Math.sin(a)*ls*.85);x.stroke()}x.beginPath();x.moveTo(0,0);x.lineTo(0,ls*.9);x.lineWidth=Math.max(1.5,ls*.06);x.stroke();x.restore()}
// bamboo rake lying in the corner
{const L=Math.min(W,H)*.55,x0=W*.03,y0=H*.97,ang=-.42;x.save();x.translate(x0,y0);x.rotate(ang);x.shadowColor='rgba(60,40,10,.45)';x.shadowBlur=L*.02;x.shadowOffsetY=L*.012;const hw=L*.016,bg=x.createLinearGradient(0,-hw,0,hw);bg.addColorStop(0,'#e8d29a');bg.addColorStop(.5,'#c9a85e');bg.addColorStop(1,'#8a6a2a');x.fillStyle=bg;x.fillRect(0,-hw,L,hw*2);x.shadowColor='transparent';
x.fillStyle='rgba(90,60,20,.5)';for(let k=L*.12;k<L;k+=L*.18)x.fillRect(k,-hw,L*.008,hw*2);
const hx=L,hh=L*.32;x.shadowColor='rgba(60,40,10,.45)';x.shadowBlur=L*.02;x.fillStyle='#a07a3a';x.fillRect(hx-L*.025,-hh/2,L*.05,hh);x.shadowColor='transparent';x.fillStyle='#7a5a26';for(let k=0;k<9;k++){x.fillRect(hx+L*.02,-hh/2+hh*(k+.3)/9,L*.07,hh*.035)}x.restore()}
// fine sand grain over everything
if(!grain||grain.width!==W||grain.height!==H){grain=document.createElement('canvas');grain.width=W;grain.height=H;const gx=grain.getContext('2d'),id=gx.createImageData(W,H);for(let k=0;k<id.data.length;k+=4){const v=Math.random();if(v<.18){const c=v<.09?60:255;id.data[k]=id.data[k+1]=id.data[k+2]=c;id.data[k+3]=v<.09?28:40}}gx.putImageData(id,0,0)}x.drawImage(grain,0,0)}
let grain=null;
draw();setInterval(draw,1000);
</script></body></html>
