<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grandfather Clock</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:"Palatino Linotype",Palatino,Georgia,serif}
body{background:#4a3a2c}
svg{position:fixed;inset:0;width:100%;height:100%}
</style></head><body>
<svg viewBox="0 0 900 1060" preserveAspectRatio="xMidYMax meet">
<defs>
<filter id="wood" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".09 .006" numOctaves="3" seed="12" result="t"/><feColorMatrix in="t" values="0 0 0 0 .16 0 0 0 0 .06 0 0 0 0 .02 0 0 0 .8 0" result="g"/><feComposite in="g" in2="SourceGraphic" operator="in" result="gc"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="gc"/></feMerge></filter>
<linearGradient id="mah" x1="0" x2="1"><stop offset="0" stop-color="#3a160a"/><stop offset=".3" stop-color="#7a3418"/><stop offset=".55" stop-color="#8e4220"/><stop offset="1" stop-color="#2e1006"/></linearGradient>
<linearGradient id="mahD" x1="0" x2="1"><stop offset="0" stop-color="#2a0e04"/><stop offset=".5" stop-color="#5a240e"/><stop offset="1" stop-color="#220a02"/></linearGradient>
<linearGradient id="brass" x1="0" x2="1"><stop offset="0" stop-color="#7a5a18"/><stop offset=".45" stop-color="#f6dc8a"/><stop offset=".6" stop-color="#c9a24a"/><stop offset="1" stop-color="#6a4a10"/></linearGradient>
<radialGradient id="bob" cx="38%" cy="32%"><stop offset="0" stop-color="#fff4c8"/><stop offset=".45" stop-color="#d9b04a"/><stop offset="1" stop-color="#6a4a10"/></radialGradient>
<radialGradient id="face" cx="50%" cy="40%"><stop offset="0" stop-color="#fbf6e6"/><stop offset="1" stop-color="#e6dabb"/></radialGradient>
<linearGradient id="moonsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a3a8a"/><stop offset="1" stop-color="#0a1a4a"/></linearGradient>
<linearGradient id="glassL" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".15" stop-color="#fff" stop-opacity=".12"/><stop offset=".22" stop-color="#fff" stop-opacity="0"/><stop offset=".8" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="interior" x1="0" x2="1"><stop offset="0" stop-color="#0e0603"/><stop offset=".5" stop-color="#2a140a"/><stop offset="1" stop-color="#0e0603"/></linearGradient>
<linearGradient id="wall" gradientUnits="userSpaceOnUse" x1="0" y1="-200" x2="0" y2="900"><stop offset="0" stop-color="#6a5844"/><stop offset="1" stop-color="#3a2e22"/></linearGradient>
<pattern id="paper" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M30 6 C40 18 40 28 30 36 C20 28 20 18 30 6Z" fill="#000" opacity=".06"/><path d="M0 0 V60" stroke="#000" stroke-opacity=".05"/></pattern>
<filter id="ds" x="-20%" y="-5%" width="140%" height="110%"><feDropShadow dx="14" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter>
<filter id="hs" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="1.2" dy="2" stdDeviation="1" flood-color="#000" flood-opacity=".5"/></filter>
<clipPath id="moonwin"><path d="M-46 -60 A46 46 0 0 1 46 -60 Z"/></clipPath>
<clipPath id="trunkwin"><path d="M372 520 V470 Q450 430 528 470 V860 H372Z"/></clipPath>
</defs>
<!-- room -->
<rect x="-900" y="-200" width="2700" height="1100" fill="url(#wall)"/><rect x="-900" y="-200" width="2700" height="1100" fill="url(#paper)"/>
<rect x="-900" y="720" width="2700" height="40" fill="#5a3a22"/><rect x="-900" y="756" width="2700" height="6" fill="#3a2414"/>
<rect x="-900" y="900" width="2700" height="200" fill="#3a2414"/>
<g id="boards" stroke="#2a180c" stroke-width="2"></g>
<ellipse cx="450" cy="990" rx="210" ry="18" fill="#000" opacity=".45"/>
<g filter="url(#ds)">
<!-- plinth -->
<path d="M300 990 L310 870 H590 L600 990Z" fill="url(#mah)" filter="url(#wood)"/>
<rect x="296" y="860" width="308" height="18" rx="3" fill="url(#mahD)"/>
<g fill="#2a0e04"><path d="M300 990 l-10 10 h40 l-4 -10z"/><path d="M600 990 l10 10 h-40 l4 -10z"/></g>
<path d="M340 960 h220 v-70 h-220z" fill="none" stroke="#2a0e04" stroke-width="3" opacity=".6"/>
<!-- trunk -->
<rect x="340" y="420" width="220" height="448" fill="url(#mah)" filter="url(#wood)"/>
<rect x="334" y="410" width="232" height="16" rx="3" fill="url(#mahD)"/>
<!-- hood -->
<rect x="318" y="140" width="264" height="280" rx="4" fill="url(#mah)" filter="url(#wood)"/>
<rect x="306" y="408" width="288" height="16" rx="3" fill="url(#mahD)"/>
<!-- broken-arch pediment -->
<path d="M300 150 Q300 100 380 70 L400 100 Q340 120 340 150 Z" fill="url(#mahD)"/><path d="M600 150 Q600 100 520 70 L500 100 Q560 120 560 150 Z" fill="url(#mahD)"/>
<rect x="296" y="142" width="308" height="16" rx="3" fill="url(#mahD)"/>
<!-- finials -->
<g fill="url(#brass)"><circle cx="450" cy="78" r="12"/><path d="M444 90 h12 l2 26 h-16z"/><circle cx="310" cy="128" r="8"/><circle cx="590" cy="128" r="8"/><path d="M450 40 l6 26 h-12z"/></g>
<!-- columns -->
<g id="cols"></g>
</g>
<!-- trunk window with pendulum and weights -->
<path d="M372 520 V470 Q450 430 528 470 V860 H372Z" fill="url(#interior)"/>
<g clip-path="url(#trunkwin)">
<g id="weights"></g>
<g id="pend"><rect x="447" y="250" width="6" height="560" fill="url(#brass)"/><circle cx="450" cy="800" r="44" fill="url(#bob)"/><circle cx="450" cy="800" r="34" fill="none" stroke="#8a6420" stroke-width="2"/><ellipse cx="438" cy="786" rx="14" ry="8" fill="#fff" opacity=".35"/></g>
</g>
<path d="M372 520 V470 Q450 430 528 470 V860 H372Z" fill="url(#glassL)"/>
<path d="M372 520 V470 Q450 430 528 470 V860 H372Z" fill="none" stroke="url(#brass)" stroke-width="5"/>
<!-- dial -->
<g transform="translate(450 290)">
<rect x="-118" y="-118" width="236" height="236" fill="url(#brass)"/>
<g fill="#8a6420" opacity=".8"><path d="M-112 -112 q40 4 34 34 q-18 -24 -34 -34z"/><path d="M112 -112 q-40 4 -34 34 q18 -24 34 -34z"/><path d="M-112 112 q40 -4 34 -34 q-18 24 -34 34z"/><path d="M112 112 q-40 -4 -34 -34 q18 24 34 34z"/></g>
<circle r="104" fill="url(#face)"/>
<!-- moon-phase arch -->
<g clip-path="url(#moonwin)"><g id="moondisc" transform="translate(0 -60)"><circle r="46" fill="url(#moonsky)"/><g id="mstars"></g><circle cx="0" cy="-30" r="14" fill="#f4e6b0"/><circle cx="0" cy="30" r="14" fill="#f4e6b0"/>
<circle cx="-4" cy="-33" r="3" fill="#d9c890"/><circle cx="4" cy="27" r="3" fill="#d9c890"/></g></g>
<path d="M-46 -60 A46 46 0 0 1 46 -60" fill="none" stroke="#2a2418" stroke-width="1"/>
<path d="M-46 -60 Q-23 -70 0 -60 Q23 -70 46 -60" fill="url(#face)" stroke="#2a2418" stroke-width=".8"/>
<circle r="92" fill="none" stroke="#2a2418" stroke-width=".8"/><circle r="84" fill="none" stroke="#2a2418" stroke-width=".8"/>
<g id="ticks"></g><g id="nums" font-size="17" text-anchor="middle" dominant-baseline="central" fill="#1a140c" font-family="'Times New Roman',serif"></g>
<!-- seconds sub-dial and date aperture -->
<g transform="translate(0 30)"><circle r="18" fill="none" stroke="#2a2418" stroke-width=".7"/><g id="sticks"></g><line id="sh" y1="3" y2="-16" stroke="#1a140c" stroke-width="1"/></g>
<rect x="-12" y="54" width="24" height="15" fill="#fff" stroke="#2a2418"/><text id="dw" y="65" text-anchor="middle" font-size="11" fill="#111"></text>
<text y="-8" text-anchor="middle" font-size="8" fill="#5a4a30" font-style="italic">Tempus Fugit</text>
<!-- serpentine hands -->
<g id="hh" filter="url(#hs)"><path d="M-3 12 L-2 -30 C-9 -32 -9 -44 0 -48 C9 -44 9 -32 2 -30 L3 12 Z M0 -48 L-3 -54 L0 -58 L3 -54Z" fill="#1a140c"/><circle cy="-39" r="3.4" fill="#f0e6c8"/></g>
<g id="mh" filter="url(#hs)"><path d="M-2.2 14 L-1.2 -62 C-5 -64 -5 -70 0 -72 C5 -70 5 -64 1.2 -62 L2.2 14 Z M0 -72 L-1.6 -82 L0 -86 L1.6 -82Z" fill="#1a140c"/><circle cy="-67" r="1.8" fill="#f0e6c8"/></g>
<circle r="5" fill="url(#brass)"/>
</g>
<!-- hood glass reflection -->
<rect x="332" y="172" width="236" height="236" fill="url(#glassL)"/>
<text id="cap" x="450" y="1040" text-anchor="middle" font-size="22" fill="#e9d7a6" font-style="italic"></text>
</svg>
<script>
const NS="http://www.w3.org/2000/svg",$=id=>document.getElementById(id);
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
for(let x=-900;x<1800;x+=120)el('line',{x1:x,x2:x+40,y1:900,y2:1100},$('boards'));
for(const cx of [330,570]){el('rect',{x:cx-10,y:170,width:20,height:236,fill:'url(#mahD)'},$('cols'));el('rect',{x:cx-14,y:164,width:28,height:10,fill:'url(#brass)'},$('cols'));el('rect',{x:cx-14,y:398,width:28,height:10,fill:'url(#brass)'},$('cols'));for(let y=180;y<396;y+=12)el('line',{x1:cx-6,x2:cx+6,y1:y,y2:y+8,stroke:'#1a0800','stroke-width':1.4,opacity:.5},$('cols'))}
for(let i=0;i<60;i++)el('line',{y1:-92,y2:-84,stroke:'#1a140c','stroke-width':i%5?.6:1.8,transform:`rotate(${i*6})`},$('ticks'));
['XII','I','II','III','IIII','V','VI','VII','VIII','IX','X','XI'].forEach((r,i)=>{if(i===0)return;const a=i*Math.PI/6,x=Math.sin(a)*72,y=-Math.cos(a)*72;el('text',{x,y,transform:`rotate(${i*30} ${x} ${y})`},$('nums')).textContent=r});
for(let i=0;i<60;i++)el('line',{y1:-18,y2:i%5?-16:-14,stroke:'#2a2418','stroke-width':.4,transform:`rotate(${i*6})`},$('sticks'));
for(let i=0;i<30;i++){const a=Math.random()*Math.PI*2,r=4+Math.random()*40;el('circle',{cx:Math.cos(a)*r,cy:Math.sin(a)*r,r:.4+Math.random()*.6,fill:'#fff'},$('mstars'))}
function weight(x,y){return `<line x1="${x}" y1="250" x2="${x}" y2="${y}" stroke="url(#brass)" stroke-width="1.6"/><path d="M${x-4} ${y} h8 l2 10 h-12z" fill="url(#brass)"/><rect x="${x-14}" y="${y+10}" width="28" height="110" rx="4" fill="url(#brass)"/><rect x="${x-14}" y="${y+10}" width="28" height="6" fill="#8a6420"/><rect x="${x-14}" y="${y+114}" width="28" height="6" fill="#8a6420"/><rect x="${x-9}" y="${y+18}" width="5" height="96" fill="#fff" opacity=".3"/>`}
function tick(){const d=new Date(),s=d.getSeconds()+d.getMilliseconds()/1000,m=d.getMinutes()+s/60,h=d.getHours()%12+m/60;
$('pend').setAttribute('transform',`rotate(${Math.cos(s*Math.PI)*5} 450 250)`);
$('hh').setAttribute('transform',`rotate(${h*30})`);$('mh').setAttribute('transform',`rotate(${m*6})`);$('sh').setAttribute('transform',`rotate(${Math.floor(s)*6})`);
// weights descend: hour weight over 12 h, minute weight over the hour
$('weights').innerHTML=weight(392,480+h/12*210)+weight(508,480+m/60*210);
$('dw').textContent=d.getDate();
const age=(((d-Date.UTC(2000,0,6,18,14))/864e5)%29.530588+29.530588)%29.530588;$('moondisc').setAttribute('transform',`translate(0 -60) rotate(${age/29.530588*180-90})`);
$('cap').textContent=d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · '+d.toLocaleTimeString();requestAnimationFrame(tick)}
tick();
</script></body></html>
