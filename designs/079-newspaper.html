<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Daily Clock</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#d8d2c4;font-family:Georgia,"Times New Roman",serif;color:#1a1a1a}
.page{position:fixed;inset:2.5vmin;background:#f4efe3;padding:2.5vmin 3.5vmin;box-sizing:border-box;box-shadow:0 1vmin 3vmin rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.mast{text-align:center;font-family:"Old English Text MT","UnifrakturMaguntia","Times New Roman",serif;font-size:clamp(26px,min(8vw,10vh),110px);line-height:1}
.bar{display:flex;justify-content:space-between;border-top:3px double #1a1a1a;border-bottom:1px solid #1a1a1a;padding:.6vh 0;margin:1vh 0 1.6vh;font-size:clamp(9px,1.6vmin,16px);text-transform:uppercase;letter-spacing:.08em;gap:2vw}
.head{text-align:center;font-weight:bold;font-size:clamp(26px,min(9vw,13vh),150px);line-height:1;letter-spacing:-.02em}
.deck{text-align:center;font-style:italic;font-size:clamp(12px,2.6vmin,26px);margin:1.2vh 0 1.6vh;border-bottom:1px solid #1a1a1a;padding-bottom:1.4vh}
.cols{flex:1;column-count:3;column-gap:3vmin;column-rule:1px solid #bbb;font-size:clamp(10px,1.7vmin,16px);line-height:1.45;text-align:justify;overflow:hidden;min-height:0}
.cols h3{margin:0 0 .4em;font-size:1.2em;break-after:avoid}
.cols p{margin:0 0 .8em}
.cols p:first-of-type::first-letter{float:left;font-size:3.2em;line-height:.85;padding-right:.08em}
@media (max-aspect-ratio:1/1){.cols{column-count:1}}
</style></head><body>
<div class="page"><div class="mast">The Daily Clock</div>
<div class="bar"><span id="vol"></span><span id="dl"></span><span>Price: one moment</span></div>
<div class="head" id="h"></div><div class="deck" id="dk"></div><div class="cols" id="c"></div></div>
<script>
const N=['twelve','one','two','three','four','five','six','seven','eight','nine','ten','eleven'];
function story(d){const y=d.getFullYear(),doy=Math.floor((new Date(y,d.getMonth(),d.getDate())-new Date(y,0,0))/864e5),left=(y%4==0?366:365)-doy,f=(d.getHours()*60+d.getMinutes())/1440,mins=d.getHours()*60+d.getMinutes();
return `<h3>Minute hand advances again</h3><p>In a development observers described as “entirely expected”, the minute hand moved forward at ${d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} this ${d.getHours()<12?'morning':d.getHours()<18?'afternoon':'evening'}, bringing the day to ${(f*100).toFixed(1)} per cent completion. Officials confirmed that ${mins} minutes have now elapsed since midnight, and that a further ${1440-mins} remain.</p>
<p>The hour hand, which has drawn criticism for its slow pace, was last seen near ${N[d.getHours()%12]}. A spokesperson declined to say when it would reach ${N[(d.getHours()+1)%12]}, citing ongoing negotiations with the gears.</p>
<h3>${d.toLocaleDateString('en',{weekday:'long'})} continues</h3><p>Day ${doy} of the year proceeded without incident. Analysts expect ${left} more days before the calendar resets, and warn that ${d.toLocaleDateString('en',{month:'long'})} will not last forever.</p>
<p>Weekend watchers note that Saturday is ${(6-d.getDay()+7)%7||7} day${((6-d.getDay()+7)%7||7)>1?'s':''} away. Readers are advised to remain calm.</p>
<h3>Seconds: a closer look</h3><p>Sixty seconds make a minute, a ratio inherited from Babylonian astronomers who counted in base sixty. At press time, the second count stood at ${d.getSeconds()}, a figure that is already out of date.</p>
<p>Midnight, the paper's most anticipated event, is ${Math.floor((1440-mins)/60)} hours and ${(1440-mins)%60} minutes away.</p>`}
let lastM=-1;
function tick(){const d=new Date();if(d.getMinutes()!==lastM){lastM=d.getMinutes();document.getElementById('c').innerHTML=story(d);
document.getElementById('dk').textContent=`${d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})} — clocks across the region agree`}
document.getElementById('h').textContent=`IT'S ${d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}`;
document.getElementById('dl').textContent=d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
document.getElementById('vol').textContent=`Vol. ${d.getFullYear()-1900} · No. ${Math.floor((d-new Date(d.getFullYear(),0,0))/864e5)}`}
tick();setInterval(tick,1000);
</script></body></html>
