<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>100 Clocks · Slideshow</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"Segoe UI",system-ui,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
.bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:rgba(20,20,24,.82);color:#eee;padding:6px 8px;border-radius:24px;box-shadow:0 4px 20px rgba(0,0,0,.4);z-index:5;transition:opacity .4s;font-size:13px;max-width:calc(100vw - 32px);box-sizing:border-box}
.bar.hide{opacity:0;pointer-events:none}
.bar button{background:#333;color:#eee;border:0;border-radius:16px;padding:6px 12px;cursor:pointer;font:inherit}
.bar button:hover{background:#4a4a52}
.bar span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
.grid{position:fixed;inset:0;background:rgba(10,10,14,.94);z-index:6;display:none;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.grid.open{display:flex}
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;width:min(92vw,82vh);margin-top:24px}
.cells a{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#24242a;color:#ddd;border-radius:6px;text-decoration:none;font-size:clamp(10px,1.8vmin,16px)}
.cells a:hover,.cells a.cur{background:#ffb703;color:#111}
.tip{position:fixed;top:12px;left:0;right:0;text-align:center;color:#ccc;font-size:13px;z-index:7;pointer-events:none}
</style></head><body>
<iframe id="f" title="clock"></iframe>
<div class="bar" id="bar"><button id="pv" title="Previous (←)">◀</button><span id="nm"></span><button id="nx" title="Next (→)">▶</button><button id="gr" title="All designs (G)">▦</button><button id="op" title="Open on its own">↗</button></div>
<div class="grid" id="grid"><div class="tip" id="tip">pick a design</div><div class="cells" id="cells"></div></div>
<script>
const L=[["001-neon-bonsai.html","Neon Bonsai"],["002-bauhaus-minimal.html","Minimal Bauhaus"],["003-cuckoo-clock.html","Cuckoo Clock"],["004-skeleton-gears.html","Skeleton Gears"],["005-24-hour-dial.html","24-Hour Dial"],["006-seven-segment.html","Seven Segment"],["007-dot-matrix.html","Dot Matrix"],["008-nixie-tubes.html","Nixie Tubes"],["009-stained-glass.html","Stained glass"],["010-lcd-wristwatch.html","LCD Wristwatch"],["011-split-flap-board.html","Split-Flap Board"],["012-word-grid.html","Word Grid"],["013-sentence-clock.html","Sentence Clock"],["014-roman-numerals.html","Roman Numerals"],["015-binary-leds.html","Binary LEDs"],["016-bcd-blocks.html","BCD Blocks"],["017-hex-color.html","Hex Color Time"],["018-unix-epoch.html","Unix Epoch"],["019-ferris-wheel.html","Ferris wheel"],["020-lighthouse.html","Lighthouse"],["021-mars-sol.html","Mars Sol Clock"],["022-neon-rings.html","Neon Rings"],["023-progress-bars.html","Progress Bars"],["024-pie-trio.html","Pie Trio"],["025-aquarium.html","Aquarium"],["026-particle-digits.html","Particle Digits"],["027-grandfather-pendulum.html","Grandfather Clock"],["028-hourglass.html","Hourglass"],["029-water-tank.html","Water Tank"],["030-terminal.html","Terminal"],["031-dos-commander.html","DOS Commander"],["032-handheld-console.html","Handheld Console"],["033-digital-rain.html","Digital Rain"],["034-falling-blocks.html","Falling Blocks"],["035-chinese-shichen.html","Shichen Dial"],["036-sundial.html","Sundial"],["037-orrery.html","Orrery"],["038-sky-arc.html","Sky Arc"],["039-tear-off-calendar.html","Tear-off Calendar"],["040-typewriter.html","Typewriter"],["041-neon-sign.html","Neon Sign"],["042-chalkboard.html","Chalkboard"],["043-blueprint.html","Blueprint"],["044-morse-lamp.html","Morse Lamp"],["045-braille.html","Braille Clock"],["046-tally-marks.html","Tally Marks"],["047-soroban-abacus.html","Soroban Abacus"],["048-barcode.html","Barcode Clock"],["049-pip-dice.html","Pip Dice"],["050-snow-globe.html","Snow globe"],[" ,["100-flow-field.html","Flow Field"]];
const f=document.getElementById('f'),nm=document.getElementById('nm'),grid=document.getElementById('grid'),cells=document.getElementById('cells'),tip=document.getElementById('tip');
let i=Math.max(0,Math.min(L.length-1,(parseInt(location.hash.slice(1))||1)-1));
L.forEach(([file,title],k)=>{const a=document.createElement('a');a.href='#'+(k+1);a.textContent=k+1;a.title=title;a.onmouseenter=()=>tip.textContent=(k+1)+' · '+title;a.onclick=e=>{e.preventDefault();go(k);grid.classList.remove('open')};cells.appendChild(a)});
function go(k){i=(k+L.length)%L.length;f.src=L[i][0];nm.textContent=(i+1)+' / '+L.length+' · '+L[i][1];history.replaceState(null,'','#'+(i+1));[...cells.children].forEach((a,j)=>a.classList.toggle('cur',j===i));wake()}
document.getElementById('pv').onclick=()=>go(i-1);document.getElementById('nx').onclick=()=>go(i+1);
document.getElementById('gr').onclick=()=>grid.classList.toggle('open');document.getElementById('op').onclick=()=>open(L[i][0],'_blank');
grid.onclick=e=>{if(e.target===grid)grid.classList.remove('open')};
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(i+1);else if(e.key==='ArrowLeft')go(i-1);else if(e.key==='g'||e.key==='G')grid.classList.toggle('open');else if(e.key==='Escape')grid.classList.remove('open')});
// hide the toolbar after a few idle seconds; mouse movement brings it back
const bar=document.getElementById('bar');let t;function wake(){bar.classList.remove('hide');clearTimeout(t);t=setTimeout(()=>bar.classList.add('hide'),3000)}
addEventListener('mousemove',wake);addEventListener('touchstart',wake);
f.addEventListener('load',()=>{try{f.contentWindow.addEventListener('mousemove',wake);f.contentWindow.addEventListener('keydown',e=>{if(['ArrowRight','ArrowLeft','g','G'].includes(e.key))dispatchEvent(new KeyboardEvent('keydown',{key:e.key}))})}catch(e){}});
go(i);
</script></body></html>
