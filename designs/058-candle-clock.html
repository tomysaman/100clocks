<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Candle Clock</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 40% 45%,#3a2410,#0c0703 60%);font-family:"Palatino Linotype",Palatino,serif;color:#f1d9a8}
.wrap{height:100%;display:flex;align-items:flex-end;justify-content:center;gap:8vw}
.cwrap{position:relative;height:96vh;width:min(14vw,16vh);display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.candle{position:relative;width:100%;background:linear-gradient(90deg,#d8c9a8,#fbf3df 40%,#e8dcc0 70%,#bba887);border-radius:.6vmin .6vmin 0 0;transition:height 1s linear}
.candle::before{content:"";position:absolute;left:0;right:0;top:-1vh;height:2vh;border-radius:50%;background:radial-gradient(#fff6e0,#e8dcc0)}
.mark{position:absolute;left:0;right:0;height:1px;background:rgba(120,60,20,.6)}
.mark span{position:absolute;left:110%;top:-.8em;font-size:min(1.6vh,1.6vw);color:#c9a878;white-space:nowrap}
.wick{position:absolute;left:50%;top:-3vh;width:.5vh;height:2.4vh;margin-left:-.25vh;background:#222;border-radius:.3vh}
.flame{position:absolute;left:50%;top:-11vh;width:3.6vh;height:9vh;margin-left:-1.8vh;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 75%,#fff 0 15%,#ffe58a 30%,#ff9a1a 60%,rgba(255,80,0,0) 72%);filter:blur(.5px);animation:fl .15s infinite alternate;transform-origin:50% 90%}
.glow{position:absolute;left:50%;top:-16vh;width:32vh;height:32vh;margin-left:-16vh;border-radius:50%;background:radial-gradient(rgba(255,170,60,.25),transparent 60%);pointer-events:none;animation:gl 3s infinite alternate}
@keyframes fl{from{transform:scale(1,1) rotate(-1.5deg)}to{transform:scale(.94,1.05) rotate(1.5deg)}}
@keyframes gl{to{opacity:.7}}
.holder{width:180%;height:3vh;background:linear-gradient(#a57a3a,#5a3a14);border-radius:50%/40%;flex:none}
.side{align-self:center;max-width:40vw}
.t{font-size:clamp(30px,min(9vw,13vh),140px);text-shadow:0 0 2vmin rgba(255,160,40,.4)}
.d{font-size:clamp(13px,3vmin,30px);font-style:italic;opacity:.85}
.n{font-size:clamp(11px,2vmin,20px);opacity:.55;margin-top:2vh}
@media (max-aspect-ratio:1/1){.wrap{gap:4vw}.side{max-width:55vw}.t{font-size:12vw}.glow{width:18vh;height:18vh;margin-left:-9vh;top:-11vh}}
</style></head><body>
<div class="wrap"><div class="cwrap"><div class="candle" id="cd"><div class="glow"></div><div class="wick"></div><div class="flame"></div></div><div class="holder"></div></div>
<div class="side"><div class="t" id="t"></div><div class="d" id="d"></div><div class="n">A day-long candle: it is relit at midnight and burns one notch per hour.</div></div></div>
<script>
const cd=document.getElementById('cd'),FULL=78;// candle height in vh at midnight
for(let h=0;h<=24;h+=2){const m=document.createElement('div');m.className='mark';m.style.bottom=(FULL*(1-h/24))+'vh';if(h<24)m.innerHTML=`<span>${String(h).padStart(2,'0')}:00</span>`;cd.appendChild(m)}
function tick(){const d=new Date(),f=(d.getHours()*3600+d.getMinutes()*60+d.getSeconds())/86400,h=Math.max(FULL*(1-f),1.5);
cd.style.height=h+'vh';[...cd.querySelectorAll('.mark')].forEach(m=>{m.style.bottom=(parseFloat(m.style.bottom)>=0?m.style.bottom:0);m.style.display=parseFloat(m.style.bottom)>h-.5?'none':''});
document.getElementById('t').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
document.getElementById('d').textContent=d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
tick();setInterval(tick,1000);
</script></body></html>
