<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Periodic Time</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#f3f4f6;color:#1d2433;font-family:"Segoe UI",system-ui,sans-serif}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh}
.row{display:flex;gap:min(2vw,3vh);align-items:center}
.el{width:min(22vw,32vh);aspect-ratio:1;border-radius:1vmin;padding:1.6vmin;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 1vmin 2.5vmin rgba(0,0,0,.12);transition:background .5s}
.el .n{font-size:min(3vw,4.4vh);font-weight:600}
.el .s{font-size:min(9vw,13vh);font-weight:700;line-height:1;text-align:center}
.el .nm{font-size:min(1.7vw,2.4vh);text-align:center}
.el .m{font-size:min(1.4vw,2vh);opacity:.7;text-align:center}
.col{font-size:min(7vw,10vh);font-weight:300;color:#99a}
.date{font-size:clamp(13px,3vmin,30px)}
.key{font-size:clamp(10px,1.8vmin,18px);opacity:.6}
.sm .el{width:min(11vw,16vh);padding:1vmin}.sm .el .s{font-size:min(4.4vw,6.4vh)}.sm .el .n{font-size:min(1.6vw,2.2vh)}.sm .el .nm,.sm .el .m{display:none}
</style></head><body>
<div class="wrap"><div class="row" id="t"></div><div class="row sm" id="d"></div><div class="date" id="dt"></div><div class="key">hours · minutes · seconds as atomic numbers — 0 is the neutron</div></div>
<script>
const E='n,Neutron,1.009|H,Hydrogen,1.008|He,Helium,4.003|Li,Lithium,6.94|Be,Beryllium,9.012|B,Boron,10.81|C,Carbon,12.011|N,Nitrogen,14.007|O,Oxygen,15.999|F,Fluorine,18.998|Ne,Neon,20.180|Na,Sodium,22.990|Mg,Magnesium,24.305|Al,Aluminium,26.982|Si,Silicon,28.085|P,Phosphorus,30.974|S,Sulfur,32.06|Cl,Chlorine,35.45|Ar,Argon,39.948|K,Potassium,39.098|Ca,Calcium,40.078|Sc,Scandium,44.956|Ti,Titanium,47.867|V,Vanadium,50.942|Cr,Chromium,51.996|Mn,Manganese,54.938|Fe,Iron,55.845|Co,Cobalt,58.933|Ni,Nickel,58.693|Cu,Copper,63.546|Zn,Zinc,65.38|Ga,Gallium,69.723|Ge,Germanium,72.630|As,Arsenic,74.922|Se,Selenium,78.971|Br,Bromine,79.904|Kr,Krypton,83.798|Rb,Rubidium,85.468|Sr,Strontium,87.62|Y,Yttrium,88.906|Zr,Zirconium,91.224|Nb,Niobium,92.906|Mo,Molybdenum,95.95|Tc,Technetium,98|Ru,Ruthenium,101.07|Rh,Rhodium,102.91|Pd,Palladium,106.42|Ag,Silver,107.87|Cd,Cadmium,112.41|In,Indium,114.82|Sn,Tin,118.71|Sb,Antimony,121.76|Te,Tellurium,127.60|I,Iodine,126.90|Xe,Xenon,131.29|Cs,Caesium,132.91|Ba,Barium,137.33|La,Lanthanum,138.91|Ce,Cerium,140.12|Pr,Praseodymium,140.91'.split('|').map(s=>s.split(','));
function cat(z){if(z===0)return '#d9dce3';if([1,6,7,8,15,16,34].includes(z))return '#a7f3d0';if([2,10,18,36,54].includes(z))return '#c4b5fd';if([3,11,19,37,55].includes(z))return '#fca5a5';if([4,12,20,38,56].includes(z))return '#fdba74';if([5,14,32,33,51,52].includes(z))return '#fde68a';if([9,17,35,53].includes(z))return '#93c5fd';if(z>=57)return '#f9a8d4';if([13,31,49,50].includes(z))return '#cbd5e1';return '#fecaca'}
function el(z){const [s,n,m]=E[z];return `<div class="el" style="background:${cat(z)}"><span class="n">${z}</span><span class="s">${s}</span><span class="nm">${n}</span><span class="m">${m}</span></div>`}
let last='';
function tick(){const d=new Date(),k=d.toTimeString().slice(0,8);if(k===last)return;last=k;
document.getElementById('t').innerHTML=el(d.getHours())+'<span class="col">:</span>'+el(d.getMinutes())+'<span class="col">:</span>'+el(d.getSeconds());
document.getElementById('d').innerHTML=el(d.getDate())+el(d.getMonth()+1)+el(d.getFullYear()%100);
document.getElementById('dt').textContent=d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
tick();setInterval(tick,200);
</script></body></html>
