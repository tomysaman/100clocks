<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shichen Dial</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(#5a1010,#240404);color:#f6d28b;font-family:"KaiTi","STKaiti","Microsoft YaHei",serif}
.wrap{height:100%;display:flex;align-items:center;justify-content:center;gap:5vw}
svg{width:min(62vw,90vh);height:min(62vw,90vh)}
.side{display:flex;flex-direction:column;gap:2vh;max-width:30vw}
.big{font-size:clamp(30px,min(8vw,12vh),130px);line-height:1}
.l{font-size:clamp(12px,2.6vmin,26px);opacity:.85}
.s{font-family:"Segoe UI",sans-serif;font-size:clamp(11px,2vmin,20px);opacity:.6}
@media (max-aspect-ratio:1/1){.wrap{flex-direction:column;gap:2vh}svg{width:min(92vw,60vh);height:min(92vw,60vh)}.side{max-width:90vw;text-align:center}}
</style></head><body>
<div class="wrap">
<svg viewBox="-110 -110 220 220">
<circle r="106" fill="#2e0606" stroke="#d4a64a" stroke-width="2"/>
<g id="dial"></g>
<circle r="40" fill="#3a0808" stroke="#d4a64a" stroke-width="1"/>
<text id="cn" y="-4" text-anchor="middle" font-size="22" fill="#ffd98a"></text>
<text id="an" y="16" text-anchor="middle" font-size="10" fill="#f6d28b" opacity=".8"></text>
<path d="M0 -104 L-6 -116 L6 -116Z" fill="#ffd98a"/>
</svg>
<div class="side"><div class="l">时辰</div><div class="big" id="sc"></div><div class="l" id="ke"></div><div class="l" id="lunar"></div><div class="s" id="g"></div></div>
</div>
<script>
const Z='子丑寅卯辰巳午未申酉戌亥',A='鼠牛虎兔龙蛇马羊猴鸡狗猪',EN=['Rat','Ox','Tiger','Rabbit','Dragon','Snake','Horse','Goat','Monkey','Rooster','Dog','Pig'];
const NS="http://www.w3.org/2000/svg",dial=document.getElementById('dial');
for(let i=0;i<12;i++){const g=document.createElementNS(NS,'g');g.setAttribute('transform',`rotate(${i*30})`);
g.innerHTML=`<line y1="-106" y2="-42" stroke="#d4a64a" stroke-width=".6" transform="rotate(15)"/><text y="-82" text-anchor="middle" font-size="18" fill="#ffd98a">${Z[i]}</text><text y="-60" text-anchor="middle" font-size="11" fill="#f6d28b" opacity=".75">${A[i]}</text>`;dial.appendChild(g)}
for(let i=0;i<96;i++){const l=document.createElementNS(NS,'line');l.setAttribute('y1',-104);l.setAttribute('y2',i%8==0?-98:-101);l.setAttribute('stroke','#d4a64a');l.setAttribute('stroke-width',.6);l.setAttribute('transform',`rotate(${i*3.75+15})`);dial.appendChild(l)}
const KE=['初','一','二','三','四','五','六','七'];
function tick(){const d=new Date(),h=d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;
// 子时 is 23:00–01:00, centred on midnight. Rotate dial so the current time sits under the pointer.
const pos=((h+1)%24)/2,idx=Math.floor(pos);dial.setAttribute('transform',`rotate(${-(h/2)*30})`);
document.getElementById('cn').textContent=Z[idx]+'时';document.getElementById('an').textContent=A[idx]+' · '+EN[idx];
const half=pos%1<.5?'初':'正',ke=Math.floor((pos%1)*8)%4;
document.getElementById('sc').textContent=Z[idx]+half;
document.getElementById('ke').textContent=`${Z[idx]}时${half}${['初','一','二','三'][ke]}刻`;
let lunar='';try{lunar=new Intl.DateTimeFormat('zh-CN-u-ca-chinese',{year:'numeric',month:'long',day:'numeric'}).format(d)}catch(e){}
document.getElementById('lunar').textContent='农历 '+lunar;
document.getElementById('g').textContent=d.toLocaleString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'})}
tick();setInterval(tick,1000);
</script></body></html>
