<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rotating Dial</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#e7e2d8;font-family:"Avenir Next","Segoe UI",sans-serif;color:#222}
.stage{position:absolute;left:50%;top:50%;width:min(150vw,150vh);height:min(150vw,150vh);transform:translate(-50%,-14%)}
svg{width:100%;height:100%}
.ptr{position:fixed;left:50%;top:0;height:50vh;width:.5vmin;background:#e3412b;transform:translateX(-50%)}
.ptr::after{content:"";position:absolute;bottom:-1.2vmin;left:50%;width:2.4vmin;height:2.4vmin;margin-left:-1.2vmin;border-radius:50%;background:#e3412b}
.info{position:fixed;left:0;right:0;top:4vh;text-align:center;z-index:2}
.info b{display:inline-block;font-size:clamp(16px,4vmin,40px);font-weight:600;background:#e7e2d8;padding:0 2vmin}
.info div{display:inline-block;background:#e7e2d8;padding:0 2vmin;font-size:clamp(11px,2.2vmin,22px);color:#555;margin-top:.6vh}
</style></head><body>
<div style="position:fixed;inset:0;overflow:hidden"><div class="stage"><svg viewBox="-100 -100 200 200" id="dial"><circle r="99" fill="#f7f4ee" stroke="#222" stroke-width=".4"/><g id="g"></g></svg></div></div>
<div class="ptr"></div>
<div class="info"><b id="t"></b><br><div id="d"></div></div>
<script>
// A huge 12-hour dial turns beneath a fixed pointer; only the top arc is visible.
const NS="http://www.w3.org/2000/svg",g=document.getElementById('g');
for(let i=0;i<720;i++){const l=document.createElementNS(NS,'line'),hr=i%60===0,q=i%15===0,f=i%5===0;l.setAttribute('y1',-98);l.setAttribute('y2',hr?-86:q?-91:f?-94:-96);l.setAttribute('stroke','#222');l.setAttribute('stroke-width',hr?.6:q?.35:.15);l.setAttribute('transform',`rotate(${i/2})`);g.appendChild(l);
if(hr){const t=document.createElementNS(NS,'text');t.setAttribute('y',-76);t.setAttribute('font-size',9);t.setAttribute('text-anchor','middle');t.setAttribute('font-weight','600');t.setAttribute('transform',`rotate(${i/2})`);t.textContent=(i/60)||12;g.appendChild(t)}
else if(q){const t=document.createElementNS(NS,'text');t.setAttribute('y',-84);t.setAttribute('font-size',2.6);t.setAttribute('text-anchor','middle');t.setAttribute('fill','#777');t.setAttribute('transform',`rotate(${i/2})`);t.textContent=':'+String(i%60).padStart(2,'0');g.appendChild(t)}}
const dial=document.getElementById("dial"),ptr=document.querySelector(".ptr");function place(){const r=document.querySelector(".stage").getBoundingClientRect();ptr.style.height=(r.top+r.height*.005+r.height*.06)+"px"}addEventListener("resize",place);place();
function tick(){const d=new Date(),h=d.getHours()%12+d.getMinutes()/60+d.getSeconds()/3600+d.getMilliseconds()/3600000;
dial.style.transform=`rotate(${-h*30}deg)`;
document.getElementById('t').textContent=d.toLocaleTimeString();document.getElementById('d').textContent=d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});requestAnimationFrame(tick)}
tick();
</script></body></html>
