<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radio Tuner</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#2a1a10;font-family:"Futura","Century Gothic",Arial,sans-serif}
.wrap{height:100%;display:flex;align-items:center;justify-content:center}
.radio{width:min(94vw,170vh);background:linear-gradient(#7a4a24,#4e2c12);border-radius:3vmin;padding:3vmin;box-sizing:border-box;box-shadow:0 2vmin 5vmin #000,inset 0 .4vmin .6vmin rgba(255,255,255,.2)}
.dial{position:relative;background:linear-gradient(#f6e2a8,#e9c97a);border-radius:1.2vmin;padding:2vmin 3vmin;box-shadow:inset 0 0 3vmin rgba(150,90,0,.5),0 0 4vmin rgba(255,200,100,.25)}
.band{position:relative;height:6vh;border-bottom:1px solid rgba(80,40,0,.4);display:flex;align-items:flex-end}
.band .nm{position:absolute;left:-1vmin;top:0;font-size:clamp(9px,1.6vmin,16px);color:#7a3a10;font-weight:bold}
.band span{position:absolute;bottom:.4vh;transform:translateX(-50%);font-size:clamp(9px,1.8vmin,18px);color:#3a2008}
.band i{position:absolute;bottom:0;width:1px;background:#3a2008}
.needle{position:absolute;top:0;bottom:0;width:.5vmin;background:#d0201a;box-shadow:0 0 1vmin rgba(208,32,26,.6);transition:left .4s}
.st{display:flex;justify-content:space-between;align-items:center;margin-top:2vmin;color:#f6e2a8;gap:2vw}
.knob{width:min(12vw,16vh);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#d9c7a0,#6b5030);box-shadow:0 1vmin 2vmin rgba(0,0,0,.6);position:relative}
.knob::after{content:"";position:absolute;left:48%;top:6%;width:4%;height:26%;background:#2a1a10}
.disp{text-align:center;flex:1}
.disp b{display:block;font-size:clamp(26px,min(7vw,11vh),100px);font-weight:normal;letter-spacing:.06em}
.disp small{font-size:clamp(11px,2.2vmin,22px);opacity:.8;letter-spacing:.2em}
.eye{width:min(4vw,6vh);aspect-ratio:1;border-radius:50%;background:radial-gradient(#9dff7a,#1f6a10);box-shadow:0 0 2vmin #6dff4a}
</style></head><body>
<div class="wrap"><div class="radio"><div class="dial" id="dial">
<div class="band" id="b1"><span class="nm">MIN</span></div>
<div class="band" id="b2"><span class="nm">HRS</span></div>
<div class="needle" id="n1"></div></div>
<div class="st"><div class="knob" id="k1"></div><div class="disp"><b id="t"></b><small id="d"></small></div><div class="eye"></div><div class="knob" id="k2"></div></div></div></div>
<script>
const b1=document.getElementById('b1'),b2=document.getElementById('b2');
for(let m=0;m<=60;m++){const i=document.createElement('i');i.style.left=(4+m/60*92)+'%';i.style.height=m%5?'1vh':'2vh';b1.appendChild(i);if(m%10===0){const s=document.createElement('span');s.style.left=(4+m/60*92)+'%';s.style.bottom='2.4vh';s.textContent=m;b1.appendChild(s)}}
for(let h=0;h<=24;h++){const i=document.createElement('i');i.style.left=(4+h/24*92)+'%';i.style.height=h%3?'1vh':'2vh';b2.appendChild(i);if(h%3===0){const s=document.createElement('span');s.style.left=(4+h/24*92)+'%';s.style.bottom='2.4vh';s.textContent=h;b2.appendChild(s)}}
const n=document.getElementById('n1');
// second needle for hours
const n2=n.cloneNode();n2.style.background='#1a3ad0';n2.style.boxShadow='0 0 1vmin rgba(26,58,208,.6)';n2.style.top='50%';n.style.bottom='50%';document.getElementById('dial').appendChild(n2);
function tick(){const d=new Date(),s=d.getSeconds(),m=d.getMinutes()+s/60,h=d.getHours()+m/60;
n.style.left=`calc(3vmin + (100% - 6vmin) * ${(4+m/60*92)/100})`;n2.style.left=`calc(3vmin + (100% - 6vmin) * ${(4+h/24*92)/100})`;
document.getElementById('k1').style.transform=`rotate(${m*6}deg)`;document.getElementById('k2').style.transform=`rotate(${h*15}deg)`;
const p=x=>String(x).padStart(2,'0');document.getElementById('t').textContent=p(d.getHours())+':'+p(d.getMinutes());
document.getElementById('d').textContent=d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase()}
tick();setInterval(tick,1000);
</script></body></html>
