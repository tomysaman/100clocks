<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dot Orbits</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:#111;font-family:"Helvetica Neue",Arial,sans-serif}
.wrap{height:100%;display:flex;align-items:center;justify-content:center}
svg{width:min(94vw,94vh);height:min(94vw,94vh)}
text{font-family:"Helvetica Neue",Arial,sans-serif}
</style></head><body>
<div class="wrap"><svg viewBox="-100 -100 200 200" id="sv">
<g id="S"></g><g id="M"></g><g id="H"></g>
<text id="t" y="2" text-anchor="middle" font-size="16" font-weight="700"></text>
<text id="d" y="14" text-anchor="middle" font-size="5" fill="#888" letter-spacing=".8"></text>
</svg></div>
<script>
const NS="http://www.w3.org/2000/svg";
function ring(g,n,r,sz){const a=[];for(let i=0;i<n;i++){const c=document.createElementNS(NS,'circle'),t=i/n*Math.PI*2;c.setAttribute('cx',Math.sin(t)*r);c.setAttribute('cy',-Math.cos(t)*r);c.setAttribute('r',sz);c.setAttribute('fill','#e8e8e8');c.style.transition='fill .3s, r .3s';g.appendChild(c);a.push(c)}return a}
const S=ring(document.getElementById('S'),60,90,2.4),M=ring(document.getElementById('M'),60,70,2.2),H=ring(document.getElementById('H'),24,48,3.4);
function tick(){const d=new Date(),s=d.getSeconds(),m=d.getMinutes(),h=d.getHours();
S.forEach((c,i)=>{c.setAttribute('fill',i<=s?'#ff3b30':'#eee');c.setAttribute('r',i===s?3.6:2.4)});
M.forEach((c,i)=>c.setAttribute('fill',i<=m?'#111':'#eee'));H.forEach((c,i)=>{c.setAttribute('fill',i<=h?'#0a84ff':'#eee');c.setAttribute('r',i===h?4.6:3.4)});
const p=n=>String(n).padStart(2,'0');document.getElementById('t').textContent=p(h)+':'+p(m);
document.getElementById('d').textContent=d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'}).toUpperCase()}
tick();setInterval(tick,250);
</script></body></html>
