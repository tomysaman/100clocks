<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Berlin Clock</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#cfd8e0,#9aa8b4);font-family:"DIN Alternate","Segoe UI",sans-serif;color:#222}
.wrap{height:100%;display:flex;align-items:center;justify-content:center;gap:5vw}
.clock{display:flex;flex-direction:column;align-items:center;gap:1.2vh;width:min(54vw,80vh)}
.sec{width:22%;aspect-ratio:1;border-radius:50%;border:.8vmin solid #555;background:#5a4a2a;box-sizing:border-box;transition:background .1s}
.sec.on{background:radial-gradient(circle at 40% 35%,#fff7b0,#f7c600);box-shadow:0 0 3vmin #f7c600}
.row{display:flex;gap:1%;width:100%;padding:1.2%;background:#555;border-radius:1vmin;box-sizing:border-box}
.row i{flex:1;height:min(7vh,5vw);border-radius:.6vmin;background:#4a2a2a;transition:background .2s}
.row.y i{background:#4a4a2a}
.row i.r{background:linear-gradient(#ff5a4a,#d0160a);box-shadow:0 0 1.5vmin rgba(255,60,40,.7)}
.row i.yy{background:linear-gradient(#ffe36a,#e0b000);box-shadow:0 0 1.5vmin rgba(255,210,0,.7)}
.pole{width:6%;height:6vh;background:#555}
.side{display:flex;flex-direction:column;gap:1.5vh;font-size:clamp(12px,2.2vmin,22px);max-width:32vw}
.t{font-size:clamp(28px,min(7vw,10vh),100px);font-weight:bold}
.k{opacity:.7;line-height:1.6}
@media (max-aspect-ratio:1/1){.wrap{flex-direction:column;gap:2vh}.clock{width:88vw}.side{max-width:90vw;text-align:center}.k{display:none}}
</style></head><body>
<div class="wrap"><div class="clock" id="c"><div class="sec" id="s"></div></div>
<div class="side"><div class="t" id="t"></div><div id="d"></div>
<div class="k">Mengenlehreuhr: top lamp blinks each second.<br>Row 1: 5 hours each · Row 2: 1 hour each<br>Row 3: 5 minutes each (red = quarters) · Row 4: 1 minute each</div></div></div>
<script>
const c=document.getElementById('c'),rows=[];
[[4,''],[4,''],[11,'y'],[4,'y']].forEach(([n,cls])=>{const r=document.createElement('div');r.className='row '+cls;for(let i=0;i<n;i++)r.appendChild(document.createElement('i'));c.appendChild(r);rows.push([...r.children])});
const pole=document.createElement('div');pole.className='pole';c.appendChild(pole);
function tick(){const d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();
document.getElementById('s').classList.toggle('on',s%2===0);
const v=[Math.floor(h/5),h%5,Math.floor(m/5),m%5];
rows.forEach((lamps,ri)=>lamps.forEach((l,i)=>{const on=i<v[ri];l.className=on?(ri<2?'r':(ri===2&&(i+1)%3===0?'r':'yy')):''}));
const p=n=>String(n).padStart(2,'0');document.getElementById('t').textContent=p(h)+':'+p(m)+':'+p(s);
document.getElementById('d').textContent=d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
tick();setInterval(tick,250);
</script></body></html>
