<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nixie Tubes</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#2a1a10,#0a0604 70%);font-family:"Century Gothic","Futura","Trebuchet MS",sans-serif}
svg{position:fixed;inset:0;width:100%;height:100%}
</style></head><body>
<svg viewBox="0 0 1000 470" preserveAspectRatio="xMidYMid meet">
<defs>
<pattern id="mesh" width="7" height="6" patternUnits="userSpaceOnUse"><path d="M0 3 L1.75 0 H5.25 L7 3 L5.25 6 H1.75Z" fill="none" stroke="#6a5a48" stroke-width=".55"/></pattern>
<linearGradient id="glass" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".12" stop-color="#fff" stop-opacity=".05"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset=".82" stop-color="#fff" stop-opacity=".04"/><stop offset=".92" stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity=".06"/></linearGradient>
<linearGradient id="getter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9ccd2" stop-opacity=".75"/><stop offset="1" stop-color="#c9ccd2" stop-opacity="0"/></linearGradient>
<linearGradient id="walnut" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a4a26"/><stop offset=".15" stop-color="#5a3216"/><stop offset="1" stop-color="#2a1608"/></linearGradient>
<linearGradient id="socket" x1="0" x2="1"><stop offset="0" stop-color="#111"/><stop offset=".5" stop-color="#3a3a3e"/><stop offset="1" stop-color="#111"/></linearGradient>
<linearGradient id="brass" x1="0" x2="1"><stop offset="0" stop-color="#7a5a18"/><stop offset=".5" stop-color="#f0d68a"/><stop offset="1" stop-color="#7a5a18"/></linearGradient>
<filter id="wood" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".004 .2" numOctaves="3" seed="4" result="t"/><feColorMatrix in="t" values="0 0 0 0 .2 0 0 0 0 .1 0 0 0 0 .03 0 0 0 .75 0" result="g"/><feComposite in="g" in2="SourceGraphic" operator="in" result="gc"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="gc"/></feMerge></filter>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b1"/><feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b2"/><feMerge><feMergeNode in="b1"/><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="spill" cx="50%" cy="50%"><stop offset="0" stop-color="#ff7a1a" stop-opacity=".35"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
</defs>
<!-- warm light spilling on the base -->
<ellipse cx="500" cy="372" rx="470" ry="40" fill="url(#spill)"/>
<g id="tubes" transform="translate(22 0)"></g>
<!-- walnut base with brass plate -->
<rect x="40" y="368" width="920" height="54" rx="8" fill="url(#walnut)" filter="url(#wood)"/>
<rect x="40" y="368" width="920" height="3" fill="#a8703e" opacity=".6"/>
<rect x="40" y="420" width="920" height="10" rx="4" fill="#1a0c04"/>
<g transform="translate(500 395)"><rect x="-150" y="-13" width="300" height="26" rx="3" fill="url(#brass)"/><text id="plate" y="5" text-anchor="middle" font-size="14" fill="#3a2406" letter-spacing="3" font-family="Georgia,serif"></text></g>
</svg>
<script>
const NS="http://www.w3.org/2000/svg",$=id=>document.getElementById(id);
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
// IN-14 style tubes: six digit tubes and two small neon bulbs for the colons
const slots=[['d',130],['d',255],['c',335],['d',415],['d',540],['c',620],['d',700],['d',825]],tubes=[],dots=[];
slots.forEach(([k,cx])=>{const g=el('g',{},$('tubes'));
if(k==='d'){const w=110,top=60,bot=360;
el('rect',{x:cx-w/2+8,y:bot-14,width:w-16,height:22,rx:4,fill:'url(#socket)'},g);for(let i=0;i<9;i++)el('line',{x1:cx-36+i*9,x2:cx-36+i*9,y1:bot-4,y2:bot+8,stroke:'#b8bcc4','stroke-width':1.4},g);
const path=`M${cx-w/2} ${bot-14} V${top+40} Q${cx-w/2} ${top} ${cx} ${top} Q${cx+w/2} ${top} ${cx+w/2} ${top+40} V${bot-14} Z`;
el('path',{d:path,fill:'rgba(30,20,14,.55)'},g);
el('rect',{x:cx-w/2+10,y:top+46,width:w-20,height:bot-top-80,fill:'url(#mesh)',opacity:.7},g);
// stacked cathodes: all ten digits as thin wire, the lit one glows
const digits=[];[1,6,2,7,5,0,4,9,8,3].forEach(n=>{const t=el('text',{x:cx,y:(top+bot)/2+48,'text-anchor':'middle','font-size':150,'font-weight':200,fill:'none',stroke:'#7a6a5a','stroke-width':1.6,opacity:.28},g);t.textContent=n;digits[n]=t});
const lit=el('text',{x:cx,y:(top+bot)/2+48,'text-anchor':'middle','font-size':150,'font-weight':200,fill:'none',stroke:'#ffb050','stroke-width':3.4,filter:'url(#glow)'},g);
const core=el('text',{x:cx,y:(top+bot)/2+48,'text-anchor':'middle','font-size':150,'font-weight':200,fill:'none',stroke:'#fff2d0','stroke-width':1.1},g);
el('path',{d:`M${cx-w/2+6} ${top+18} Q${cx} ${top-4} ${cx+w/2-6} ${top+18} V${top+40} H${cx-w/2+6} Z`,fill:'url(#getter)'},g);
el('path',{d:path,fill:'url(#glass)',stroke:'rgba(255,255,255,.22)','stroke-width':1.2},g);
el('path',{d:`M${cx-w/2+10} ${top+50} V${bot-40}`,stroke:'rgba(255,255,255,.35)','stroke-width':3,'stroke-linecap':'round'},g);
tubes.push({digits,lit,core,cur:null})}
else{const top=180,bot=360,w=34;el('rect',{x:cx-14,y:bot-10,width:28,height:18,rx:3,fill:'url(#socket)'},g);
const path=`M${cx-w/2} ${bot-10} V${top+16} Q${cx-w/2} ${top} ${cx} ${top} Q${cx+w/2} ${top} ${cx+w/2} ${top+16} V${bot-10} Z`;el('path',{d:path,fill:'rgba(30,20,14,.5)'},g);
const ds=[230,290].map(y=>{el('line',{x1:cx,x2:cx,y1:y+8,y2:bot-10,stroke:'#8a8e96','stroke-width':1},g);return el('circle',{cx,cy:y,r:7,fill:'#ff8a2a',filter:'url(#glow)'},g)});
el('path',{d:path,fill:'url(#glass)',stroke:'rgba(255,255,255,.22)'},g);dots.push(...ds)}});
function tick(){const d=new Date(),p=n=>String(n).padStart(2,'0'),s=p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
tubes.forEach((t,i)=>{const n=+s[i];if(t.cur!==n){t.cur=n;t.lit.textContent=n;t.core.textContent=n;t.digits.forEach((e,k)=>e.setAttribute('opacity',k===n?0:.28))}
// gentle neon flicker
t.lit.setAttribute('opacity',(.92+Math.random()*.08).toFixed(2))});
const on=d.getMilliseconds()<600;dots.forEach(e=>e.setAttribute('opacity',on?1:.15));
$('plate').textContent=d.toLocaleDateString(undefined,{weekday:'short',day:'2-digit',month:'short',year:'numeric'}).toUpperCase();requestAnimationFrame(tick)}
tick();
</script></body></html>
